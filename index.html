<style id="pageStyle">@page{margin:0}</style>
<style>
/* Layout: shop counter — bill sheet left, department shelf right; admin pages as stacked cards */
:root{
  --bg:#eef1f0; --paper:#ffffff; --ink:#15211f; --muted:#5d6b68; --line:#d6dddb; --soft:#e4eae8;
  --accent:#0d6b5f; --accent-ink:#ffffff; --accent-soft:#d8ece8; --mark:#e9a227; --mark-soft:#fbefd6;
  --danger:#b3392f; --danger-soft:#f8e1de; --scrim:rgba(10,20,18,.45);
  --roll:#ffffff; --roll-ink:#000000;
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  --f-num:ui-monospace,"Roboto Mono","SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1514; --paper:#18201f; --ink:#e6eeec; --muted:#93a29f; --line:#2b3735; --soft:#212b29;
  --accent:#3fb8a6; --accent-ink:#06201c; --accent-soft:#16332f; --mark:#f0b54a; --mark-soft:#3a2f17;
  --danger:#ef7b70; --danger-soft:#3b1d1a; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1514; --paper:#18201f; --ink:#e6eeec; --muted:#93a29f; --line:#2b3735; --soft:#212b29;
  --accent:#3fb8a6; --accent-ink:#06201c; --accent-soft:#16332f; --mark:#f0b54a; --mark-soft:#3a2f17;
  --danger:#ef7b70; --danger-soft:#3b1d1a; --scrim:rgba(0,0,0,.6); color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav{background:var(--paper);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:10px;max-width:1440px;margin:0 auto}
.brand{font-weight:800;font-size:17px;letter-spacing:-.01em}
.nav nav{display:flex;gap:2px;flex-wrap:wrap;flex:1;min-width:0}
.nav nav button{border:0;background:transparent;padding:7px 11px;border-radius:7px;color:var(--muted);font-weight:600}
.nav nav button:hover{background:var(--soft);color:var(--ink)}
.nav nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.me{display:flex;align-items:center;gap:8px;font-weight:600}
.role{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:3px 8px;border-radius:99px;background:var(--soft);color:var(--muted)}
.role.admin{background:var(--ink);color:var(--paper)}
.demo{background:var(--mark-soft);border-bottom:1px solid var(--mark);font-size:12.5px}
.demo .wrap{max-width:1440px;margin:0 auto;padding-block:7px}
main.page{max-width:1440px;margin:0 auto;padding-block:14px}

.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 12px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.armed,.btn.danger.solid{background:var(--danger);color:var(--paper);border-color:var(--danger)}
.btn:disabled{opacity:.55;cursor:default}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.field input,.field select,.field textarea,.inp{border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--bg);min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row .field{flex:1 1 140px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2,.card h3{margin:0}
.card h2{font-size:17px}
.card h3{font-size:14px}
.note{color:var(--muted);font-size:12.5px;line-height:1.5;margin:0}
h1.title{font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.stack{display:flex;flex-direction:column;gap:14px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.seg{display:inline-flex;background:var(--soft);border-radius:8px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:6px;padding:7px 12px;font-weight:700;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.14);color:var(--accent)}
.pill{display:inline-block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:99px;background:var(--mark-soft);color:var(--ink);vertical-align:1px}
.pill.red{background:var(--danger-soft);color:var(--danger)}
.pill.green{background:var(--accent-soft);color:var(--accent)}
#custName,#bAddr,#qaName,#puSup,#puNote,#nName,#nDept,#nAlias,#renTo,#ngName,#uName,#sShop,#sH0,#sH1,#sH2,#sH3,#sNote,#sFooter,#suShop,#suName,#sTop,#pList [data-f=name],#pList [data-f=dept],#pList [data-f=aliases],#npName,#npDept{text-transform:uppercase}#custName::placeholder,#bAddr::placeholder,#qaName::placeholder,#puSup::placeholder,#puNote::placeholder,#nName::placeholder,#nDept::placeholder,#nAlias::placeholder,#renTo::placeholder,#ngName::placeholder,#uName::placeholder,#sShop::placeholder,#sH0::placeholder,#sH1::placeholder,#sH2::placeholder,#sH3::placeholder,#sNote::placeholder,#sFooter::placeholder,#suShop::placeholder,#suName::placeholder,#pList [data-f=name]::placeholder,#pList [data-f=dept]::placeholder,#pList [data-f=aliases]::placeholder,#npName::placeholder,#npDept::placeholder{text-transform:none}
.toastbtn{margin-left:10px;background:none;border:1px solid currentColor;color:inherit;border-radius:6px;padding:4px 12px;font:inherit;font-weight:800;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-weight:600;z-index:60;max-width:calc(100% - 40px);text-align:center}
.toast.err{background:var(--danger)}
.tw{overflow-x:auto}
td.num{white-space:nowrap}td.num .pill{display:table;margin-top:2px}   /* dates, bill numbers and amounts never break across lines */
table{width:100%;border-collapse:collapse}
th{background:var(--paper);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--soft);vertical-align:middle}
.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--bg)}
tr.sel td{background:var(--accent-soft)}
tr.cx td{color:var(--muted);text-decoration:line-through}
tfoot td{font-weight:700;border-top:1px solid var(--line)}
.empty{padding:32px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* Billing */
.billing{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:14px;height:clamp(580px,calc(100vh - 150px),1100px)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-width:0;min-height:0}
.corrbar{background:var(--mark-soft);border-bottom:1px solid var(--mark);padding:12px 16px;display:flex;flex-direction:column;gap:8px;border-radius:12px 12px 0 0}
.corrbar .t{font-weight:800}
.corrbar .t span{font-weight:500;color:var(--muted)}
.corrbar input{flex:1 1 220px;border:1px solid var(--mark);border-radius:6px;padding:8px 10px;background:var(--paper)}
.billhead{display:flex;flex-wrap:wrap;gap:10px 16px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:flex-end}
.billhead .field input{padding:6px 8px}
.billno{font-size:15px;font-weight:600;padding:6px 0}
.grow{flex:1 1 150px}
.tablewrap{overflow:auto;flex:1;min-height:150px}
.tablewrap th{position:sticky;top:0;z-index:1}
.inp.miss,select.miss,input.miss{border-color:var(--danger)!important;box-shadow:0 0 0 1px var(--danger) inset}
.tablewrap input.needq{border-color:var(--gold);background:rgba(233,162,39,.14);box-shadow:0 0 0 1px var(--gold) inset}
.tablewrap input.needq::placeholder{color:var(--gold-ink,#7a5200);opacity:.8;font-weight:600}
@media (prefers-color-scheme:dark){.tablewrap input.needq::placeholder{color:#f3c56b}}
td.sn{color:var(--muted);width:28px}
td.item{font-weight:600;min-width:110px}
td.item small{display:block;font-weight:500;color:var(--muted);font-size:11px}
td input{width:76px;border:1px solid var(--line);border-radius:6px;padding:5px 6px;background:var(--bg);text-align:right;font-family:var(--f-num)}
td input.edited{background:var(--mark-soft);border-color:var(--mark)}
td select{border:1px solid var(--line);border-radius:6px;padding:5px 4px;background:var(--bg)}
.del{border:0;background:transparent;color:var(--muted);font-size:19px;line-height:1;padding:4px 7px;border-radius:6px}
.del:hover{color:var(--danger);background:var(--soft)}
.ratecell{display:flex;align-items:center;gap:4px;justify-content:flex-end}
.reset{border:0;background:transparent;color:var(--mark);font-size:13px;font-weight:800;padding:2px}
tr.flash-row td{animation:rowflash 1.2s ease-out}
@keyframes rowflash{from{background:var(--accent-soft)}to{background:transparent}}
.totals{border-top:1px solid var(--line);padding:10px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center}
.totals .l{color:var(--muted)}
.totals input{width:96px;border:1px solid var(--line);border-radius:6px;padding:5px 6px;background:var(--bg);text-align:right;font-family:var(--f-num)}
.grand{font-size:26px;font-weight:700;color:var(--accent)}
.grandl{font-weight:800;font-size:15px}
.words{grid-column:1/-1;font-size:12px;color:var(--muted);font-style:italic}
.billact{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 14px;align-items:center}
.billact .primary{flex:1 1 160px;padding:12px;font-size:14px}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600}
.cathead{padding:12px 14px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.searchrow{display:flex;gap:8px;align-items:stretch}
.search{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--bg);width:100%;min-width:0;flex:1}
.mic{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;width:46px;display:grid;place-items:center;flex:none;position:relative}
.mic svg{width:20px;height:20px}
.mic.live{background:var(--danger);border-color:var(--danger)}
.mic.live::after{content:"";position:absolute;inset:-4px;border-radius:11px;border:2px solid var(--danger);animation:pulse 1.1s ease-out infinite}
@keyframes pulse{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.18)}}
.voiceopts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.voicebox{border:1px dashed var(--accent);border-radius:9px;padding:9px 11px;display:flex;flex-direction:column;gap:7px;background:var(--accent-soft)}
.voicebox .heard{font-size:13px}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choices button{border:1px solid var(--accent);background:var(--paper);border-radius:99px;padding:6px 11px;font-weight:600;font-size:12.5px}
.say{display:flex;gap:6px}
.say input{flex:1;min-width:0;border:1px dashed var(--line);border-radius:7px;padding:7px 9px;background:var(--bg);font-size:12.5px}
.depts{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.depts.dv-lines{flex-wrap:wrap;overflow:visible}
.dept.deptall{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
#deptPanel{position:fixed;inset:0;z-index:60;background:var(--paper);display:flex;flex-direction:column}
#deptPanel .dph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
#deptPanel .dph b{font-size:18px}
#deptPanel .dpg{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;padding:12px 12px 24px;overflow:auto}
#deptPanel .dpt{border:1px solid var(--line);border-left:6px solid var(--dc,var(--line));border-radius:12px;padding:12px 4px;text-align:center;background:var(--bg);color:var(--ink);font-weight:700;font-size:12px;letter-spacing:-.01em;min-height:72px;display:flex;flex-direction:column;justify-content:center;gap:4px;overflow-wrap:break-word;hyphens:auto}
#deptPanel .dpt span{color:var(--muted);font-weight:500;font-size:12px}
#deptPanel .dpt[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
#deptPanel .dpt[aria-pressed="true"] span{color:var(--paper);opacity:.75}
.dept{flex:none;border:1px solid var(--line);background:transparent;border-radius:99px;padding:6px 12px;font-weight:600;font-size:12.5px;white-space:nowrap}
.dept span{color:var(--muted);font-weight:500;margin-left:4px}
.dept[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dept[aria-pressed="true"] span{color:inherit;opacity:.7}
.grid{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:14px;min-height:200px}
.group h3{margin:0 0 7px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.tile{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 10px;display:flex;flex-direction:column;gap:6px;transition:border-color .12s,transform .08s}
.tile:hover{border-color:var(--accent)}
.tile:active{transform:scale(.97)}
.tile .n{font-weight:600;font-size:13px;line-height:1.25}
.tile .p{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:12px;color:var(--muted)}
.tile .p b{color:var(--ink);font-family:var(--f-num);font-weight:600;font-size:13px}
.tile.inbill{border-color:var(--accent);background:var(--accent-soft)}
.catfoot{padding:9px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.switch{display:none;background:var(--soft);border-radius:10px;padding:4px;gap:4px;margin-bottom:10px}
.switch button{flex:1;border:0;background:transparent;padding:9px;border-radius:7px;font-weight:700}
.switch button[aria-pressed="true"]{background:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-family:var(--f-num);font-size:20px;font-weight:600}
.stat span{font-size:12px;color:var(--muted)}
.stat.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stat.hero span{color:inherit;opacity:.85}
.twocol{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:14px;align-items:start}
.bar{height:6px;border-radius:3px;background:var(--accent);min-width:2px}
.barcell{width:28%}
.down{color:var(--danger)}
.up{color:var(--accent)}
.logentry{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.loghead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 12px;background:var(--bg);align-items:baseline}
.loghead b{font-size:14px}
.loghead small{color:var(--muted);font-size:12px}
.logbody{padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.reason{font-size:13px}
.reason span{color:var(--muted)}
.chg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:13px}
.chg li{padding-left:16px;position:relative}
.chg li::before{position:absolute;left:0;font-weight:800;font-family:var(--f-num)}
.chg li.add::before{content:"+";color:var(--accent)}
.chg li.del::before{content:"−";color:var(--danger)}
.chg li.chg::before,.chg li.info::before{content:"~";color:var(--mark)}
.netchg{font-family:var(--f-num);font-size:13px;font-weight:600}

/* Receipt — always paper white, like the roll */
.rprev{background:var(--soft);border-radius:10px;padding:14px;display:flex;justify-content:center;overflow-x:auto}
/* thermal receipts are laid out at the width the printer can really print (80 mm paper → 72 mm, 58 mm paper → 48 mm)
   so nothing is shrunk; bold sans-serif text prints darker and reads better on thermal paper */
.rcpt{background:var(--roll);color:var(--roll-ink);font-family:Roboto,"Noto Sans","Segoe UI",Arial,sans-serif;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.28;flex:none;box-shadow:0 2px 10px rgba(0,0,0,.15);box-sizing:border-box}
.rcpt.w80{width:72mm;padding:2mm .8mm;font-size:15px}
.rcpt.w58{width:48mm;padding:1.5mm .5mm;font-size:12.5px}
.rcpt.w80.tsN{font-size:13px}.rcpt.w80.tsX{font-size:17px}.rcpt.w80.tsXX{font-size:19px}
.rcpt.w58.tsN{font-size:11px}.rcpt.w58.tsX{font-size:14px}.rcpt.w58.tsXX{font-size:15.5px}
.wcheck{border:2px solid #000;text-align:center;padding:2mm 0}.wcheck .rule{display:flex;justify-content:space-between;font-size:11px;border-top:1px dashed #000;margin-top:2mm;padding-top:1mm}
.rcpt .b,.rcpt .it,.rcpt .net{font-weight:800}
/* normal printer (A4 / A5): same slips, page width, normal font */
.rcpt.wA4,.rcpt.wA5,.rcpt.wA5L{flex:none;box-sizing:border-box;padding:7mm 8mm;font-family:var(--f-ui,system-ui),sans-serif;font-size:13px;line-height:1.45}
.rcpt.wA4{width:194mm}.rcpt.wA5{width:132mm;font-size:12px}.rcpt.wA5L{width:196mm;font-size:12px;padding:5mm 6mm}
/* full-page invoice for A4 / A5 */
.inv{background:#fff;color:#111;font-family:var(--f-ui,system-ui),"Segoe UI",Roboto,Arial,sans-serif;font-size:12.5px;line-height:1.4;width:194mm;box-sizing:border-box;padding:8mm 9mm;flex:none;box-shadow:0 2px 10px rgba(0,0,0,.15);text-align:left}
.inv.A5{width:132mm;padding:6mm 6mm;font-size:10.5px}
/* A5 landscape: wide and short, so everything is packed tight to leave the most room for item rows */
.inv.A5L{width:196mm;padding:4mm 5mm;font-size:10.5px;line-height:1.3}
.inv.A5L .ttl{padding:.6mm;margin-bottom:1.5mm;font-size:1em}
.inv.A5L .top{padding-bottom:1.5mm;gap:4mm}.inv.A5L .shop .nm{font-size:1.4em}
.inv.A5L .party{padding:1.5mm 0}.inv.A5L .party>div{display:flex;flex-wrap:wrap;gap:0 3mm;align-items:baseline}
.inv.A5L table{margin:1.5mm 0}.inv.A5L th,.inv.A5L td{padding:.5mm 1.2mm}
.inv.A5L .tot .net{padding:.6mm 0}.inv.A5L .note{padding-top:1mm;margin-top:1mm}
.inv.A5L .meta .ttl{display:inline-block;margin:0 0 .8mm;padding:.3mm 3mm}
.inv.A5L .party .lb{margin-right:1mm}.inv.A5L .party>div:last-child{justify-content:flex-end}
.inv.A5L .sum3{display:grid;grid-template-columns:auto 1fr auto;gap:4mm;align-items:start;break-inside:avoid}
.inv.A5L .sum3 .gt{margin:0;min-width:0}.inv.A5L .sum3 .tot{min-width:58mm}
.inv.A5L .mid .note{border-top:0;padding-top:0;margin-top:1mm;font-size:.9em}.inv.A5L .mid .foot{text-align:left;margin-top:1mm}
.inv.A5L .signw{text-align:right;margin-top:1.5mm;font-size:.92em}
/* long bills continue on the next page with the column headings repeated */
.reqcode{font-family:var(--f-num,monospace);font-size:22px;font-weight:700;letter-spacing:.06em;text-align:center;padding:12px;border:2px dashed var(--accent);border-radius:10px;user-select:all;word-break:break-all}
.featlist{display:grid;grid-template-columns:1fr;gap:2px;font-size:13.5px;margin:4px 0 10px}.featlist .off{color:var(--muted);opacity:.75}.featlist .on{font-weight:600}
@media (min-width:700px){.featlist{grid-template-columns:1fr 1fr}}
.pline{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:6px 10px;align-items:end;padding:10px 0;border-bottom:1px solid var(--line)}
.pline .pn{grid-column:1/-1}.pline label{font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px;font-weight:600}
.pline input,.pline select{width:100%;box-sizing:border-box;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:15px}.pline .pa{display:flex;flex-direction:column;align-items:flex-end}.pline .del{justify-self:end}
.billbtns{flex-wrap:wrap;position:sticky;bottom:-1px;z-index:2;background:var(--paper);padding:10px 0 6px;margin-top:4px;box-shadow:0 -10px 14px -10px rgba(0,0,0,.35)}.billbtns .btn{flex:1 1 30%}.billbtns .btn.primary{flex-basis:100%;padding:12px;font-size:16px}
.savedh{color:var(--accent)}
.inv thead{display:table-header-group}.inv tr{break-inside:avoid}.inv .sum,.inv .sign,.inv .sum3{break-inside:avoid}
.inv *{letter-spacing:normal}.inv th{text-transform:none;color:#111}
.inv .ttl{text-align:center;font-weight:800;letter-spacing:.12em;font-size:1.05em;border:1.5px solid #111;padding:1.2mm;margin-bottom:3mm}
.topl{text-align:center;font-weight:600;letter-spacing:.02em;margin-bottom:1mm}.rcpt .topl{margin-bottom:2px}
.inv .top{display:flex;justify-content:space-between;gap:6mm;align-items:flex-start;border-bottom:1.5px solid #111;padding-bottom:3mm}
.inv .shop .nm{font-size:1.6em;font-weight:800;display:block;line-height:1.15}.inv .meta{text-align:right;white-space:nowrap}
.inv .tag{display:inline-block;border:1px solid #111;padding:.4mm 2mm;font-weight:700;margin:2mm 0 0}.inv .void{color:#b00;border-color:#b00}
.inv .party{display:flex;gap:6mm;justify-content:space-between;padding:3mm 0;border-bottom:1px solid #999}
.inv .party .lb{font-size:.82em;text-transform:uppercase;letter-spacing:.06em;color:#555}
.inv table{width:100%;border-collapse:collapse;margin:3mm 0}
.inv th,.inv td{border:1px solid #999;padding:1.2mm 1.6mm;text-align:right;vertical-align:top}
.inv th{background:#f0f0f0;font-size:.86em;font-weight:700}
.inv th.l,.inv td.l{text-align:left}.inv td.l{word-break:break-word}
.inv .sum{display:flex;justify-content:space-between;gap:6mm;align-items:flex-start}
.inv .tot{min-width:62mm}.inv .tot div{display:flex;justify-content:space-between;gap:4mm;padding:.5mm 0}
.inv .tot .net{font-weight:800;font-size:1.25em;border-top:1.5px solid #111;border-bottom:1.5px solid #111;padding:1.2mm 0;margin-top:1mm}
.inv .words{font-style:italic}.inv .note{white-space:pre-line;font-size:.92em;border-top:1px solid #999;padding-top:2mm;margin-top:2mm;color:#111}
.inv .sign{display:flex;justify-content:space-between;align-items:flex-end;margin-top:8mm}.inv .sign .r{text-align:right}
.inv .foot{text-align:center;margin-top:4mm;font-size:.92em}
.inv .gt{width:auto;min-width:55%}
.rcpt .c{text-align:center}.rcpt .b{font-weight:700}.rcpt .big{font-size:1.35em}
.rcpt .hr{border-top:1px dashed var(--roll-ink);margin:1.6mm 0}
.rcpt .lr{display:flex;justify-content:space-between;gap:0 2mm;flex-wrap:wrap}
.rcpt .lr span:first-child{min-width:0;overflow-wrap:anywhere}
.rcpt .lr span:last-child{text-align:right;white-space:nowrap;margin-left:auto}   /* a long amount drops to its own line instead of running off the paper */
.rcpt .gl{padding-left:2mm}.rcpt .lr span.wr{white-space:normal}
.rcpt .it{font-weight:700;word-break:break-word}
.rcpt .net{font-size:1.3em;font-weight:700}
.rcpt .tag{border:1px solid var(--roll-ink);text-align:center;font-weight:700;padding:.5mm;margin:1mm 0}
.rcpt .void{font-size:1.6em;text-align:center;font-weight:700;border:2px solid var(--roll-ink);margin:1mm 0}
.rcpt .pre{white-space:pre-line}
.rcpt .bnote{white-space:pre-line;font-size:.9em;line-height:1.35}
.rcpt .sm{font-size:.88em}.rcpt .gtab{width:100%;border-collapse:collapse;font-size:.88em;margin:1mm 0}.rcpt .gtab th,.rcpt .gtab td{text-align:right;padding:0 .5mm;border:0}.rcpt .gtab th:first-child,.rcpt .gtab td:first-child{text-align:left}.rcpt .gtab th{border-bottom:1px dashed var(--roll-ink);background:none;color:var(--roll-ink);text-transform:none;letter-spacing:0;font-weight:700;position:static}.rcpt .gtab td{color:var(--roll-ink);background:none;padding-top:.4mm}.rcpt .gtab tr.b td{font-weight:700;border-top:1px dashed var(--roll-ink)}
.rcpt .pl{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:2mm;white-space:nowrap;align-items:start}
.rcpt .pl span:first-child{white-space:normal;overflow-wrap:anywhere}   /* full product name: it wraps instead of being cut with "…" */
.rcpt .pl span:nth-child(2),.rcpt .pl span:nth-child(3){text-align:right}
.rcpt .pl span:nth-child(3){min-width:15mm}

.overlay{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:calc(28px + env(safe-area-inset-top,0px)) 12px calc(28px + env(safe-area-inset-bottom,0px))}
.modal{background:var(--paper);border-radius:14px;width:min(460px,100%);padding:18px;display:flex;flex-direction:column;gap:14px}
.modal h2{margin:0;font-size:18px}
.authwrap{min-height:calc(100vh - 40px);display:grid;place-items:center;padding-block:24px}
.authcard{width:min(420px,100%)}
.creds{display:grid;grid-template-columns:auto auto auto;gap:4px 14px;font-size:12.5px;background:var(--bg);border-radius:8px;padding:10px 12px}
.creds b{font-family:var(--f-num);font-weight:600}

@media (max-width:900px){
  .billing{grid-template-columns:minmax(0,1fr);height:auto}
  .switch{display:flex}
  .billing[data-view="bill"] .catalog{display:none}
  .billing[data-view="cat"] .bill{display:none}
  .panel{min-height:70vh}
  .split{grid-template-columns:minmax(0,1fr)}
  td input{width:62px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.pill.blue{background:var(--accent-soft);color:var(--accent)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:99px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;text-align:center;margin-left:4px}
.ro-prod #pList input,.ro-prod #pList select{pointer-events:none;background:transparent;border-color:transparent}.ro-prod [data-del],.ro-prod [data-save],.ro-prod [data-pick],.ro-prod [data-undel],.ro-prod #pAll{display:none!important}
.rights label{display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-weight:500}.rights input{margin-top:3px}
.ordbtn{font-weight:700}
.tile .stk{display:block;font-size:11px;font-weight:700;margin-top:2px;color:var(--muted)}.tile .stk.low{color:#b26a00}.tile .stk.out{color:var(--danger)}
.stk-low{color:#b26a00;font-weight:700}.stk-out{color:var(--danger);font-weight:700}
.rcpt table.st{width:100%;border-collapse:collapse;font-size:10.5px;margin-top:2mm}.rcpt table.st th,.rcpt table.st td{border-bottom:1px solid #999;padding:1.5px 3px;text-align:right}.rcpt table.st th:first-child,.rcpt table.st td:first-child,.rcpt table.st td:nth-child(2),.rcpt table.st th:nth-child(2){text-align:left}
.restorebox{display:flex;flex-direction:column;gap:6px;background:var(--mark-soft);border:1px solid var(--mark);border-radius:10px;padding:12px}.restorebox span{font-size:14px;color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:10px 14px}

/* ============================================================ stock (plan feature "stock")

const ADJ_REASONS=["Damage / breakage","Loss / theft","Own use","Free sample","Expired","Count difference","Correction"];

/* stock is kept in the product's own unit. A bill or purchase in another unit is converted where the units are related

const UNIT_IN={Gms:["Kgs",0.001],Dozen:["Nos",12],Pair:["Nos",2]};
function unitFactor(from,to){from=from||to;if(from===to)return 1;const a=UNIT_IN[from],b=UNIT_IN[to];

function stockMoves(){const key=STOCK_VER+"|"+DB.bills.length+"|"+(DB.purchases||[]).length+"|"+(DB.stockadj||[]).length+"|"+DB.seq+"|"+valMethod();
  if(stockCache.key===key)return stockCache.mv;const mv=new Map(),add=(id,m)=>{if(!mv.has(id))mv.set(id,[]);mv.get(id).push(m)};

  const PU=new Map(DB.products.map(p=>[p.id,p.unit])),conv=(i,q)=>{const pu=PU.get(i.product_id),f=unitFactor(i.unit,pu);return f===null?{q,f:1,note:`entered as ${fq(q)} ${i.unit} — unit differs from ${pu}`}:{q:+(q*f).toFixed(3),f,note:f===1?"":`${fq(q)} ${i.unit}`}};
  (DB.purchases||[]).filter(x=>x.status==="active").forEach(x=>x.items.forEach(i=>{const c=conv(i,+i.qty);add(i.product_id,{date:x.date,kind:"in",qty:c.q,rate:r2(+i.rate/c.f),what:`Purchase ${x.inv_no||""} · ${x.supplier}`,note:c.note})}));
  DB.bills.filter(x=>x.status==="active").forEach(x=>x.items.forEach(i=>{const c=conv(i,+i.qty);add(i.product_id,{date:x.bill_date,kind:"out",qty:-c.q,what:`Sale bill ${label(x)}`,note:c.note})}));
  mv.forEach(l=>l.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.kind==="open"?-1:b.kind==="open"?1:0)));stockCache={key,mv,memo:new Map()};return mv}
const valMethod=()=>S().stock_value==="avg"?"avg":"last";
/* one product's stock as on a date (default today): quantity, cost rate, value */
/* stock of a product starts on its opening-stock date; with no opening stock, on the day of its first purchase or adjustment.
   Sales before that day are not counted (they were sold from stock that was never entered). */
function stockList(p,upto){const all=stockMoves().get(p.id)||[];const op=all.find(m=>m.kind==="open"),first=all.find(m=>m.kind!=="out");if(!first)return[];
  const start=op?op.date:first.date;return all.filter(m=>m.date>=start&&(!upto||m.date<=upto))}
function stockOf(p,upto){if(!upto){stockMoves();const c=stockCache.memo.get(p.id);if(c&&c.reorder===(num(p.reorder)>0?num(p.reorder):null))return c;const v=stockCalc(p);stockCache.memo.set(p.id,v);return v}return stockCalc(p,upto)}
function stockCalc(p,upto){const l=stockList(p,upto);let q=0,inQ=0,inV=0,last=null,open=0,pin=0,out=0,adj=0;
  l.forEach(m=>{q+=m.qty;if(m.kind==="open")open+=m.qty;else if(m.kind==="in")pin+=m.qty;else if(m.kind==="out")out-=m.qty;else adj+=m.qty;
    if((m.kind==="in"||m.kind==="open")&&m.rate>0&&m.qty>0){inQ+=m.qty;inV+=m.qty*m.rate;last=m.rate}});
  q=+q.toFixed(3);const rate=valMethod()==="avg"?(inQ?r2(inV/inQ):null):(last===null?null:r2(last));
  return{qty:q,rate,value:rate===null?0:r2(Math.max(q,0)*rate),open:+open.toFixed(3),in:+pin.toFixed(3),out:+out.toFixed(3),adj:+adj.toFixed(3),moves:l.length,reorder:num(p.reorder)>0?num(p.reorder):null,
    state:q<=0?(l.length?"out":"none"):(num(p.reorder)>0&&q<=num(p.reorder)?"low":"ok")}}
function stockAdjust(d){if(!has("stock"))throw new Bad("Stock is not part of this shop's plan.");if(!can("stockadj"))throw new Bad("Adjusting stock is for the owner. Ask the owner to give you this right.");

  const kind=d.kind==="open"?"open":"adj";const date=String(d.date||today());if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date>today())throw new Bad("Date can't be in the future.");
  if(kind==="adj"&&!qty)throw new Bad("Enter how much to add (+) or remove (−).");if(Math.abs(qty)>1000000)throw new Bad("That quantity looks too large.");
  const reason=kind==="open"?"Opening stock":(ADJ_REASONS.includes(d.reason)?d.reason:"");if(!reason)throw new Bad("Choose the reason.");
  const rate=d.rate===undefined||String(d.rate).trim()===""?null:r2(num(d.rate));if(rate!==null&&rate<0)throw new Bad("Cost can't be negative.");
  DB.stockadj=DB.stockadj||[];let replaced=null;

    {ref:p.id,...(replaced&&replaced.length?{changes:[["Opening stock",replaced.map(x=>fq(x.qty)).join(", "),fq(qty)]]}:{}),...(a.note?{info:{Note:a.note}}:{})});save();return a}

function saveStockCount(rows,apply){if(!has("stock"))throw new Bad("Stock is not part of this shop's plan.");if(!can("stockcount"))throw new Bad("Entering a stock count is switched off for your login.");
  const items=rows.filter(r=>String(r.counted).trim()!=="").map(r=>{const p=DB.products.find(x=>x.id===+r.product_id);if(!p)throw new Bad("A product in the count no longer exists.");const c=+num(r.counted).toFixed(3);if(c<0)throw new Bad(`Count for ${p.name} can't be negative.`);return{product_id:p.id,name:p.name,unit:p.unit,counted:c,book:stockOf(p).qty}});

function approveCount(id,reject){if(!can("stockadj"))throw new Bad("Approving a stock count is for the owner.");const c=(DB.stockcount||[]).find(x=>x.id===id);if(!c||c.status!=="pending")throw new Bad("This count is already done.");

function stockPeriod(d1,d2){const prev=addDays(d1,-1),out=[];

  const amount=r2(num(d.amount));if(!(amount>0))throw new Bad("Enter the amount.");if(amount>99999999)throw new Bad("That amount looks too large.");

function approveCashTx(id,reject){if(!isOwner())throw new Bad("Only the owner can approve entries.");const x=(DB.cashtx||[]).find(y=>y.id===id);if(!x||x.status!=="pending")throw new Bad("This entry is already done.");

/* ============================================================ supplier payments (paid later against credit purchases) */
const SPAY_MODES=["Cash","Bank"];
const supKey=n=>clean1(n).toLowerCase();
function supplierBook(){const m=new Map(),get=(n)=>{const k=supKey(n);if(!m.has(k))m.set(k,{key:k,name:n,gstin:"",credit:0,paid:0,bills:0,last:""});return m.get(k)};
  (DB.purchases||[]).filter(p=>p.status==="active").forEach(p=>{const e=get(p.supplier);e.name=p.supplier;if(p.gstin)e.gstin=p.gstin;if(p.paymode==="Credit"){e.credit=r2(e.credit+p.total);e.bills++}if(p.date>e.last)e.last=p.date});
  (DB.spay||[]).forEach(x=>{const e=get(x.supplier);e.paid=r2(e.paid+x.amount);if(x.date>e.last)e.last=x.date});
  return [...m.values()].map(e=>({...e,due:r2(e.credit-e.paid)})).sort((a,b)=>b.due-a.due||a.name.localeCompare(b.name))}
function paySupplier(d){if(!can("pay"))throw new Bad("You don't have the right to pay suppliers. Ask the owner.");
  const supplier=UP(d.supplier).slice(0,80);if(!supplier)throw new Bad("Choose the supplier.");
  const amount=r2(num(d.amount));if(!(amount>0))throw new Bad("Enter the amount paid.");if(amount>100000000)throw new Bad("That amount looks too large. Check it.");
  const mode=SPAY_MODES.includes(d.mode)?d.mode:null;if(!mode)throw new Bad("Choose how it was paid: Cash or Bank.");
  const date=String(d.date||today());if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date>today())throw new Bad("Payment date can't be in the future.");
  const e=supplierBook().find(x=>x.key===supKey(supplier)),before=e?e.due:0;
  const x={id:nextId(),at:stamp(),date,supplier:e?e.name:supplier,amount,mode,note:UP(d.note).slice(0,200),ref:clean1(d.ref).slice(0,40),by:me.id,before,after:r2(before-amount)};
  (DB.spay=DB.spay||[]).push(x);act("payment",`Paid ₹${fmt(amount)} to ${x.supplier} (${mode})${x.note?" · "+x.note:""}`,{ref:x.id});save();return x}
function undoSupplierPay(id){if(!isOwner())throw new Bad("Only the owner can undo a payment.");const x=(DB.spay||[]).find(y=>y.id===id);if(!x)throw new Bad("Payment not found.");
  act("payment",`Undid payment ₹${fmt(x.amount)} to ${x.supplier}`,{del:true,snap:{Supplier:x.supplier,"Amount ₹":fmt(x.amount),"Paid by":x.mode,Date:dmy(x.date),Note:x.note||"—",...(x.ref?{Against:x.ref}:{}),"Entered by":uname(x.by)}});
  DB.spay=DB.spay.filter(y=>y.id!==id);save()}

function deletePurchase(id){if(!isOwner())throw new Bad("Only the owner can remove a purchase permanently.");const x=(DB.purchases||[]).find(y=>y.id===id);if(!x)throw new Bad("Purchase not found.");
  act("purchase",`Removed permanently: purchase ${x.inv_no||"(no invoice no.)"} from ${x.supplier} · ₹${fmt(x.total)}`,{del:true,snap:{...purSnap(x),Status:x.status==="active"?"Active":"Cancelled"},items:purItems(x)});
  DB.purchases=DB.purchases.filter(y=>y.id!==id);if(x.photo)setBillPhoto(id,null).catch(()=>{});save()}

function purchaseReportHTML(d1,d2){const PR=purchaseReport(d1,d2),all=(DB.purchases||[]).filter(x=>x.date>=d1&&x.date<=d2).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);

function cashEntries(){const E=[];const add=(date,book,dir,what,amount)=>{if(amount>0.004)E.push({date,book,dir,what,amount:r2(amount)})};

  (DB.receipts||[]).forEach(r=>add(r.date,r.mode==="Cash"?"cash":"bank","in",`Received from ${r.name}${r.mode!=="Cash"?" ("+r.mode+")":""}`,r.amount));
  (DB.purchases||[]).filter(x=>x.status==="active"&&x.paymode!=="Credit").forEach(x=>add(x.date,x.paymode==="Cash"?"cash":"bank","out",`Purchase ${x.inv_no||""} · ${x.supplier}`,x.total));
  (DB.spay||[]).forEach(x=>add(x.date,x.mode==="Cash"?"cash":"bank","out",`Paid to ${x.supplier}${x.note?" · "+x.note:""}`,x.amount));
  (DB.cashtx||[]).filter(x=>x.status==="ok").forEach(x=>cashTxMoves(x).forEach(([bk,dir])=>add(x.date,bk,dir,`${x.head}${x.note?" · "+x.note:""}`,x.amount)));
  return E.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0)}

  ["cash","bank"].forEach(k=>{const o=O[k];let open=null;if(o&&o.date<=d1){open=r2(o.amount+E.filter(e=>e.book===k&&e.date>=o.date&&e.date<d1).reduce((a,e)=>a+(e.dir==="in"?e.amount:-e.amount),0))}
    const rows=E.filter(e=>e.book===k&&e.date>=d1&&e.date<=d2),days=[],byDay=new Map();let bal=open;
    rows.forEach(e=>{const t=byDay.get(e.date)||{in:0,out:0};t[e.dir]+=e.amount;byDay.set(e.date,t)});
    byDay.forEach((t,d)=>{const i=r2(t.in),o2=r2(t.out);days.push({date:d,open:bal,in:i,out:o2,close:bal===null?null:r2(bal+i-o2)});if(bal!==null)bal=r2(bal+i-o2)});
    const tin=r2(rows.filter(e=>e.dir==="in").reduce((a,e)=>a+e.amount,0)),tout=r2(rows.filter(e=>e.dir==="out").reduce((a,e)=>a+e.amount,0));

/* ============================================================ monthly accounting export (Tally XML, item-wise Excel, JSON)
   Sales are booked by payment mode: cash bill → Cash ledger; UPI / Card / Bank → Bank ledger; credit or split →
   the customer's ledger (walk-in: "Cash Sales") plus Receipt vouchers for the part paid. Purchases go to the supplier
   (credit) or Cash / Bank. Credit payments received later become Receipt vouchers. Every voucher balances exactly. */
const ACC_DEF={sales:"Sales",purchase:"Purchase",cash:"Cash",bank:"Bank",cashSales:"Cash Sales",outC:"Output CGST",outS:"Output SGST",outI:"Output IGST",
  inC:"Input CGST",inS:"Input SGST",inI:"Input IGST",round:"Round Off",disc:"Discount Allowed"};
const ACC_LABEL={sales:"Sales ledger",purchase:"Purchase ledger",cash:"Cash ledger",bank:"Bank ledger (UPI, card, bank)",cashSales:"Walk-in customer ledger",outC:"Output CGST",outS:"Output SGST",outI:"Output IGST",
  inC:"Input CGST",inS:"Input SGST",inI:"Input IGST",round:"Round off ledger",disc:"Discount ledger"};
const accNames=()=>({...ACC_DEF,...(S().acc||{})});
/* the month's entries in one neutral shape; every export format is made from this */
function accountingData(month){const A=accNames(),d1=month+"-01",d2=monthEnd(month),T=S();
  const sales=[],receipts=[],purchases=[],skipped=[];
  const modeLedger=k=>k==="cash"?A.cash:A.bank;
  /* a customer or supplier called "Bank", "Sales" … must not be booked into that account ledger */
  const own=new Set(Object.entries(A).filter(([k])=>k!=="cashSales").map(([,v])=>v.toLowerCase()));
  const partyOf=(n,kind)=>{n=clean1(n);return own.has(n.toLowerCase())?`${n} (${kind})`:n};
  DB.bills.filter(b=>b.bill_date>=d1&&b.bill_date<=d2).sort((a,b)=>a.bill_date.localeCompare(b.bill_date)||a.id-b.id).forEach(b=>{
    if(b.status!=="active"){skipped.push({no:label(b),date:b.bill_date,net:b.net});return}
    const tx=b.tax||{type:"none"},REG=tx.type==="regular",p=payOf(b),paid=["cash","upi","card","bank"].filter(k=>p[k]>0.004),cust=normCust(b.customer);
    let party;if(p.credit<=0.004&&paid.length===1)party=modeLedger(paid[0]);else party=cust?partyOf(cust,"Customer"):A.cashSales;
    const items=b.items.map(i=>({name:i.name,hsn:i.hsn||"",unit:i.unit,qty:i.qty,gst:REG?num(i.gst):"",value:REG?r2(i.taxable||0):i.amount,cgst:REG?r2(i.cgst||0):0,sgst:REG?r2(i.sgst||0):0,igst:REG?r2(i.igst||0):0,mrp_rate:i.rate}));

    const v={type:"Sales",no:label(b),date:b.bill_date,party,customer:cust||"Cash",gstin:REG?(tx.buyer_gstin||""):"",pos:REG?stateName(tx.pos):"",gst_type:tx.type,
      items,discount:REG?0:b.discount,cgst:REG?b.cgst:0,sgst:REG?b.sgst:0,igst:REG?b.igst:0,round_off:b.round_off,total:b.net,payment:payText(p),
      narration:`CB bill ${label(b)} · ${payText(p)}${b.rev?` · corrected ${b.rev}×`:""}`};

      if(cashAmt>0.004)receipts.push({type:"Receipt",no:`R-${label(b)}-C`,date:b.bill_date,party,dr:A.cash,amount:cashAmt,refs:[{name:label(b),amount:cashAmt}],narration:`Paid with bill ${label(b)} (cash)`});
      if(bankAmt>0.004)receipts.push({type:"Receipt",no:`R-${label(b)}-B`,date:b.bill_date,party,dr:A.bank,amount:bankAmt,refs:[{name:label(b),amount:bankAmt}],narration:`Paid with bill ${label(b)} (UPI/card/bank)`})}});
  (DB.receipts||[]).filter(r=>r.date>=d1&&r.date<=d2).forEach(r=>receipts.push({type:"Receipt",no:`R${r.id}`,date:r.date,party:partyOf(r.name,"Customer"),dr:r.mode==="Cash"?A.cash:A.bank,amount:r.amount,refs:(r.alloc||[]).map(a=>{const b=DB.bills.find(x=>x.id===a.bill_id);return{name:b?label(b):"",amount:a.amount}}).filter(x=>x.name),
    narration:`Credit payment (${r.mode}) against ${r.alloc.map(a=>{const b=DB.bills.find(x=>x.id===a.bill_id);return b?label(b):"?"}).join(", ")}`}));
  (DB.purchases||[]).filter(p=>p.status==="active"&&p.date>=d1&&p.date<=d2).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id).forEach(p=>{const ITC=p.kind==="itc";
    purchases.push({type:"Purchase",no:p.inv_no||`P${p.id}`,ref:p.inv_no||"",date:p.date,party:p.paymode==="Credit"?partyOf(p.supplier,"Supplier"):p.paymode==="Cash"?A.cash:A.bank,supplier:partyOf(p.supplier,"Supplier"),gstin:p.gstin||"",pos:p.state?stateName(p.state):"",itc:ITC,
      items:p.items.map(i=>({name:i.name,hsn:i.hsn||"",unit:i.unit,qty:i.qty,gst:ITC?num(i.gst):"",value:ITC?r2(i.taxable):i.amount,rate:i.rate,cgst:ITC?i.cgst:0,sgst:ITC?i.sgst:0,igst:ITC?i.igst:0})),
      cgst:ITC?p.cgst:0,sgst:ITC?p.sgst:0,igst:ITC?p.igst:0,round_off:p.round_off,total:p.total,payment:p.paymode,narration:`Supplier bill ${p.inv_no||"-"} from ${p.supplier}${p.note?" · "+p.note:""}`})});

  const cashtx=(DB.cashtx||[]).filter(x=>x.status==="ok"&&x.date>=d1&&x.date<=d2).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id).map(x=>{const bk=x.book==="cash"?A.cash:A.bank,L=CT_LEDGER[x.head]||[x.head,"Indirect Expenses"];
    return x.type==="out"?{type:"Payment",no:`CV-${x.id}`,date:x.date,dr:L[0],cr:bk,group:L[1],amount:x.amount,head:x.head,narration:`${x.head}${x.note?" · "+x.note:""} (CB entry CV-${x.id})`}:

      {type:"Contra",no:`CV-${x.id}`,date:x.date,dr:x.type==="dep"?A.bank:A.cash,cr:x.type==="dep"?A.cash:A.bank,amount:x.amount,head:x.head,narration:`${x.head}${x.note?" · "+x.note:""} (CB entry CV-${x.id})`}});
  return{shop:T.shop_name,gstin:T.gstin||"",gst_type:T.gst_type||"none",month,from:d1,to:d2,generated:stamp(),version:APP_VERSION,ledgers:A,sales,receipts,purchases,payments,cashtx,cancelled:skipped,
    ...(has("stock")&&(DB.stockadj||[]).length?{closing_stock:r2(stockRows(d2).reduce((a,r)=>a+r.value,0)),stock_method:stkVal()}:{})}}
/* ---------- Tally XML */
const xe=v=>String(v??"").replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\uFFFE\uFFFF]/g," ").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const tDate=d=>d.replace(/-/g,"");const amt=v=>(Math.round(v*100)/100).toFixed(2);
const tq=(q,u)=>`${+(+q).toFixed(3)} ${xe(u)}`;
function tallyEnvelope(id,body){return `<?xml version="1.0" encoding="UTF-8"?>\n<ENVELOPE>\n <HEADER>\n  <VERSION>1</VERSION>\n  <TALLYREQUEST>Import</TALLYREQUEST>\n  <TYPE>Data</TYPE>\n  <ID>${id}</ID>\n </HEADER>\n <BODY>\n  <DESC></DESC>\n  <DATA>\n${body}  </DATA>\n </BODY>\n</ENVELOPE>\n`}
const led=(name,dr,amount,extra="")=>`    <LEDGERENTRIES.LIST>\n     <LEDGERNAME>${xe(name)}</LEDGERNAME>\n     <ISDEEMEDPOSITIVE>${dr?"Yes":"No"}</ISDEEMEDPOSITIVE>\n${extra}     <AMOUNT>${amt(dr?-Math.abs(amount):Math.abs(amount))}</AMOUNT>\n    </LEDGERENTRIES.LIST>\n`;
function tallyVouchers(D){const A=D.ledgers;let out="";
  const inv=(i,dr,ledger)=>`    <ALLINVENTORYENTRIES.LIST>\n     <STOCKITEMNAME>${xe(i.name)}</STOCKITEMNAME>\n     <ISDEEMEDPOSITIVE>${dr?"Yes":"No"}</ISDEEMEDPOSITIVE>\n     <RATE>${amt(i.rate)}/${xe(i.unit)}</RATE>\n     <AMOUNT>${amt(dr?-i.value:i.value)}</AMOUNT>\n     <ACTUALQTY>${tq(i.qty,i.unit)}</ACTUALQTY>\n     <BILLEDQTY>${tq(i.qty,i.unit)}</BILLEDQTY>\n     <BATCHALLOCATIONS.LIST>\n      <GODOWNNAME>Main Location</GODOWNNAME>\n      <BATCHNAME>Primary Batch</BATCHNAME>\n      <AMOUNT>${amt(dr?-i.value:i.value)}</AMOUNT>\n      <ACTUALQTY>${tq(i.qty,i.unit)}</ACTUALQTY>\n      <BILLEDQTY>${tq(i.qty,i.unit)}</BILLEDQTY>\n     </BATCHALLOCATIONS.LIST>\n     <ACCOUNTINGALLOCATIONS.LIST>\n      <LEDGERNAME>${xe(ledger)}</LEDGERNAME>\n      <ISDEEMEDPOSITIVE>${dr?"Yes":"No"}</ISDEEMEDPOSITIVE>\n      <AMOUNT>${amt(dr?-i.value:i.value)}</AMOUNT>\n     </ACCOUNTINGALLOCATIONS.LIST>\n    </ALLINVENTORYENTRIES.LIST>\n`;
  const head=(v,type,view)=>`   <TALLYMESSAGE xmlns:UDF="TallyUDF">\n   <VOUCHER VCHTYPE="${type}" ACTION="Create" OBJVIEW="${view}">\n    <DATE>${tDate(v.date)}</DATE>\n    <VOUCHERTYPENAME>${type}</VOUCHERTYPENAME>\n    <VOUCHERNUMBER>${xe(v.no)}</VOUCHERNUMBER>\n${v.ref?`    <REFERENCE>${xe(v.ref)}</REFERENCE>\n    <REFERENCEDATE>${tDate(v.date)}</REFERENCEDATE>\n`:""}    <PARTYLEDGERNAME>${xe(v.party)}</PARTYLEDGERNAME>\n${v.gstin?`    <PARTYGSTIN>${xe(v.gstin)}</PARTYGSTIN>\n`:""}${v.pos?`    <PLACEOFSUPPLY>${xe(v.pos.replace(/^\d+-/,""))}</PLACEOFSUPPLY>\n`:""}    <PERSISTEDVIEW>${view}</PERSISTEDVIEW>\n${view==="Invoice Voucher View"?`    <ISINVOICE>Yes</ISINVOICE>\n    <VCHENTRYMODE>Item Invoice</VCHENTRYMODE>\n`:""}    <NARRATION>${xe(v.narration)}</NARRATION>\n`;
  const tail="   </VOUCHER>\n   </TALLYMESSAGE>\n";
  const bill=(no,a)=>`     <BILLALLOCATIONS.LIST>\n      <NAME>${xe(no)}</NAME>\n      <BILLTYPE>New Ref</BILLTYPE>\n      <AMOUNT>${amt(a)}</AMOUNT>\n     </BILLALLOCATIONS.LIST>\n`;
  D.sales.forEach(v=>{const isParty=v.party!==A.cash&&v.party!==A.bank;
    out+=head(v,"Sales","Invoice Voucher View")+led(v.party,true,v.total,`     <ISPARTYLEDGER>Yes</ISPARTYLEDGER>\n${isParty?bill(v.no,-v.total):""}`)+v.items.map(i=>inv(i,false,A.sales)).join("");
    if(v.discount>0.004)out+=led(A.disc,true,v.discount);
    if(v.cgst)out+=led(A.outC,false,v.cgst);if(v.sgst)out+=led(A.outS,false,v.sgst);if(v.igst)out+=led(A.outI,false,v.igst);
    if(Math.abs(v.round_off)>0.004)out+=led(A.round,v.round_off<0,v.round_off);out+=tail});
  D.receipts.forEach(v=>{out+=head(v,"Receipt","Accounting Voucher View")+led(v.party,false,v.amount,(v.refs||[]).map(r=>bill(r.name,r.amount).replace("New Ref","Agst Ref")).join(""))+led(v.dr,true,v.amount)+tail});
  (D.payments||[]).forEach(v=>{out+=head({...v,ref:""},"Payment","Accounting Voucher View")+led(v.party,true,v.amount,v.ref?bill(v.ref,-v.amount).replace("New Ref","Agst Ref"):"")+led(v.cr,false,v.amount)+tail});
  (D.cashtx||[]).forEach(v=>{out+=head({...v,ref:""},v.type,"Accounting Voucher View")+led(v.dr,true,v.amount)+led(v.cr,false,v.amount)+tail});
  D.purchases.forEach(v=>{const isParty=v.party!==A.cash&&v.party!==A.bank;
    out+=head(v,"Purchase","Invoice Voucher View")+led(v.party,false,v.total,`     <ISPARTYLEDGER>Yes</ISPARTYLEDGER>\n${isParty?bill(v.ref||v.no,v.total):""}`)+v.items.map(i=>inv(i,true,A.purchase)).join("");
    if(v.cgst)out+=led(A.inC,true,v.cgst);if(v.sgst)out+=led(A.inS,true,v.sgst);if(v.igst)out+=led(A.inI,true,v.igst);
    if(Math.abs(v.round_off)>0.004)out+=led(A.round,v.round_off>0,v.round_off);out+=tail});

function tallyMasters(D){const A=D.ledgers,L=[];const seen=new Set();
  const ledger=(name,parent,extra="")=>{if(!name||seen.has("L|"+name))return;seen.add("L|"+name);
    L.push(`   <TALLYMESSAGE xmlns:UDF="TallyUDF">\n   <LEDGER NAME="${xe(name)}">\n    <NAME.LIST>\n     <NAME>${xe(name)}</NAME>\n    </NAME.LIST>\n    <PARENT>${xe(parent)}</PARENT>\n${extra}   </LEDGER>\n   </TALLYMESSAGE>\n`)};
  const duty=(name,head)=>ledger(name,"Duties & Taxes",`    <TAXTYPE>GST</TAXTYPE>\n    <GSTDUTYHEAD>${head}</GSTDUTYHEAD>\n`);
  ledger(A.sales,"Sales Accounts");ledger(A.purchase,"Purchase Accounts");ledger(A.cash,"Cash-in-Hand");ledger(A.bank,"Bank Accounts");ledger(A.cashSales,"Sundry Debtors");
  ledger(A.round,"Indirect Expenses");ledger(A.disc,"Indirect Expenses");
  duty(A.outC,"Central Tax");duty(A.outS,"State Tax");duty(A.outI,"Integrated Tax");duty(A.inC,"Central Tax");duty(A.inS,"State Tax");duty(A.inI,"Integrated Tax");
  const gstinOf={};D.sales.forEach(v=>{if(v.gstin)gstinOf[v.party]=v.gstin});D.purchases.forEach(v=>{if(v.gstin)gstinOf[v.supplier]=v.gstin});
  D.sales.concat(D.receipts).forEach(v=>{if(v.party!==A.cash&&v.party!==A.bank)ledger(v.party,"Sundry Debtors",gstinOf[v.party]?`    <PARTYGSTIN>${xe(gstinOf[v.party])}</PARTYGSTIN>\n`:"")});
  (D.payments||[]).forEach(v=>ledger(v.supplier,"Sundry Creditors"));
  (D.cashtx||[]).forEach(v=>{if(v.type==="Payment")ledger(v.dr,v.group);else if(v.type==="Receipt")ledger(v.cr,v.group)});
  D.purchases.forEach(v=>ledger(v.supplier,"Sundry Creditors",v.gstin?`    <PARTYGSTIN>${xe(v.gstin)}</PARTYGSTIN>\n`:""));
  const units=new Set(),items=new Map();D.sales.concat(D.purchases).forEach(v=>v.items.forEach(i=>{units.add(i.unit);if(!items.has(i.name))items.set(i.name,i)}));
  const U=[...units].map(u=>`   <TALLYMESSAGE xmlns:UDF="TallyUDF">\n   <UNIT NAME="${xe(u)}">\n    <NAME>${xe(u)}</NAME>\n    <ISSIMPLEUNIT>Yes</ISSIMPLEUNIT>\n    <DECIMALPLACES>${["Kgs","Ltr","Mtr","Gms"].includes(u)?3:0}</DECIMALPLACES>\n   </UNIT>\n   </TALLYMESSAGE>\n`);
  const I=[...items.values()].map(i=>`   <TALLYMESSAGE xmlns:UDF="TallyUDF">\n   <STOCKITEM NAME="${xe(i.name)}">\n    <NAME.LIST>\n     <NAME>${xe(i.name)}</NAME>\n    </NAME.LIST>\n    <PARENT></PARENT>\n    <BASEUNITS>${xe(i.unit)}</BASEUNITS>\n${i.hsn?`    <DESCRIPTION>HSN ${xe(i.hsn)}${i.gst!==""?` · GST ${i.gst}%`:""}</DESCRIPTION>\n`:""}   </STOCKITEM>\n   </TALLYMESSAGE>\n`);
  return tallyEnvelope("All Masters",U.join("")+L.join("")+I.join(""))}
/* ---------- item-wise Excel (.xlsx) — one row per item; Busy / Vyapar / Marg map the columns once */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
function zipStore(files){const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  const u16=v=>[v&255,(v>>>8)&255],u32=v=>[v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255];
  files.forEach(([name,text])=>{const nb=enc.encode(name),data=enc.encode(text),c=crc32(data);
    const h=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(data.length),...u32(data.length),...u16(nb.length),...u16(0)]);
    parts.push(h,nb,data);cd.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(data.length),...u32(data.length),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nb);
    off+=h.length+nb.length+data.length});
  const cdLen=cd.reduce((a,x)=>a+x.length,0);
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cdLen),...u32(off),...u16(0)]);
  return new Blob([...parts,...cd,end],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})}
function makeXlsx(sheets){const col=n=>{let s="";n++;while(n){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s};
  const cell=(v,r,c)=>{const ref=col(c)+(r+1);if(typeof v==="number"&&isFinite(v))return `<c r="${ref}"><v>${v}</v></c>`;if(v===""||v===null||v===undefined)return "";
    return `<c r="${ref}" t="inlineStr"${r===0?' s="1"':""}><is><t xml:space="preserve">${xe(v)}</t></is></c>`};
  const sheetXml=rows=>`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetData>${rows.map((row,r)=>`<row r="${r+1}">${row.map((v,c)=>cell(v,r,c)).join("")}</row>`).join("")}</sheetData></worksheet>`;
  const files=[["[Content_Types].xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>`],
    ["_rels/.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ["xl/workbook.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${xe(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")}</sheets></workbook>`],
    ["xl/_rels/workbook.xml.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")}<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
    ["xl/styles.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="2"><xf/><xf fontId="1" applyFont="1"/></cellXfs></styleSheet>`],
    ...sheets.map((s,i)=>[`xl/worksheets/sheet${i+1}.xml`,sheetXml(s.rows)])];
  return zipStore(files)}
function accountingXlsx(D){const dmyS=d=>d.split("-").reverse().join("-");

  const sales=[SH];D.sales.forEach(v=>v.items.forEach((i,k)=>sales.push([dmyS(v.date),"Sales",v.no,v.party,v.customer,v.gstin,v.pos,v.payment,i.name,i.hsn,i.qty,i.unit,i.rate,i.value,i.gst,i.cgst,i.sgst,i.igst,r2(i.value+i.cgst+i.sgst+i.igst),k?"":v.discount,k?"":v.round_off,k?"":v.total,k?"":v.narration])));

      x.fillStyle="#e7ecea";x.fillRect(P,y+h-1,W-P*2,1);y+=h;return}

  });

function prodSearch(q,limit){q=clean1(q).toLowerCase();if(!q)return[];const out=[];
  activeProducts().forEach(p=>{const n=p.name.toLowerCase(),al=String(p.aliases||"").toLowerCase();let sc=0;
    if(n===q)sc=100;else if(n.startsWith(q))sc=80;else if(n.split(/[\s()\-\/]+/).some(w=>w.startsWith(q)))sc=60;else if(n.includes(q))sc=40;else if(al.split(",").some(a=>a.trim().startsWith(q)))sc=35;else if(al.includes(q))sc=25;else if(p.hsn&&String(p.hsn).startsWith(q))sc=20;
    if(sc)out.push({p,sc})});return out.sort((a,b)=>b.sc-a.sc||a.p.name.localeCompare(b.p.name)).slice(0,limit||8).map(x=>x.p)}

  if($("showMiss"))$("showMiss").onclick=()=>{$("pFilter").value="missing gst details";$("pFilter").dispatchEvent(new Event("input"));$("pFilter").scrollIntoView({block:"start"})};
  /* big lists: only PROD_PAGE rows are drawn at a time (a 2,000-item list stays fast on a cheap phone) */
  let pMatch=ps,pShownN=Math.min(PROD_PAGE,ps.length);
  const showCount=()=>{$("pMoreRow").hidden=pShownN>=pMatch.length;$("pShown").textContent=`Showing ${pShownN} of ${pMatch.length}`;$("pCount").textContent=pMatch.length===ps.length?ps.length:`${pMatch.length} of ${ps.length}`};
  const drawRows=()=>{$("pList").innerHTML=pMatch.slice(0,pShownN).map(pRow).join("");if($("pAll"))$("pAll").checked=false;updBulk();showCount()};
  $("pMore").onclick=()=>{const from=pShownN;pShownN=Math.min(pMatch.length,pShownN+PROD_PAGE);$("pList").insertAdjacentHTML("beforeend",pMatch.slice(from,pShownN).map(pRow).join(""));showCount()};
  $("pFilter").oninput=e=>{const q=e.target.value.trim().toLowerCase();
    pMatch=!q?ps:q==="missing gst details"?ps.filter(p=>!hasTaxInfo(p)):q==="no gst"?ps.filter(p=>p.gst===undefined||p.gst===null||p.gst===""):q==="no hsn"?ps.filter(p=>!p.hsn):ps.filter(p=>(p.name+" "+p.dept+" "+(p.aliases||"")+" "+(p.hsn||"")).toLowerCase().includes(q));
    pShownN=Math.min(PROD_PAGE,pMatch.length);drawRows()};
  showCount();
  $("nAdd").onclick=()=>{try{const raw={name:$("nName").value,dept:$("nDept").value,unit:$("nUnit").value,rate:$("nRate").value,aliases:$("nAlias").value,hsn:$("nHsn")?$("nHsn").value:"",gst:$("nGst")?$("nGst").value:""};let d=cleanProduct(raw);if(DB.products.some(x=>x.active&&x.name.toLowerCase()===d.name.toLowerCase()))throw new Bad(`${d.name} is already in the list.`);d=cleanProduct(raw,GR);{const np={id:nextId(),...d,active:true};DB.products.push(np);act("product",`Added ${np.name}`,{ref:np.id,snap:prodSnap(np)})}save();toast(`Added ${d.name}`);renderProducts();$("nName").focus()}catch(err){toast(err.message,true)}};
  if($("upFile"))$("upFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{let rows;
    if(/\.xlsx?$/i.test(f.name)){rows=await readXlsx(await f.arrayBuffer())}
    else rows=parseCSV(await f.text());const msg=importRows(rows,$("upMode").value==="replace");renderProducts();toast(msg)}catch(err){toast(err instanceof Bad?err.message:"Couldn't read that file.",true)}e.target.value=""};
  if($("pExport"))$("pExport").onclick=()=>saveFile(`products-${today()}.csv`,csv([["Item Name","Department","Unit","Rate","Alias","HSN","GST %","Reorder level"],...ps.map(p=>[p.name,p.dept,p.unit,p.rate,p.aliases,p.hsn||"",p.gst??"",p.reorder||""])]));
  if(!can("products")){$("view").classList.add("ro-prod");["nAdd","upFile","bulkMove"].forEach(id=>{const c=$(id)&&$(id).closest(".card");if(c)c.hidden=true});
    $("view").insertAdjacentHTML("afterbegin",`<p class="note"><b>View only:</b> adding, changing and deleting products is switched off for your login.</p>`)}
  if($("pTpl"))$("pTpl").onclick=()=>saveFile("product-template.csv",csv([["Item Name","Department","Unit","Rate","Alias","HSN","GST %"],["Basmati Rice","Grocery","Kgs",120,"chawal","1006",5],["Sugar","Grocery","Kgs",46,"chini, shakkar","1701",5],["Eggs","Dairy","Dozen",84,"anda","0407",0]]));
}

/* ============================================================ users */
/* Roles: internal "admin" = Owner (you), internal "staff" = Admin (the person running the shop). */
const roleName=r=>r==="admin"?"Owner":"Admin";
function renderUsers(){
  const O=isOwner();
  const lastBill=id=>{const b=DB.bills.filter(x=>x.created_by===id).sort((a,b)=>b.created_at.localeCompare(a.created_at))[0];return b?dmy(b.bill_date):"—"};
  const us=DB.users.slice().sort((a,b)=>b.active-a.active||a.role.localeCompare(b.role)||a.name.localeCompare(b.name));
  const canEdit=u=>O||(u.role!=="admin"&&(can("users")||u.id===me.id));            /* Admin can't touch an Owner login */
  const RG=O,limited=u=>rightsOffered().filter(k=>!RIGHT_OFF_BY_DEFAULT[k]&&!rightOn(u,k)).length;
  $("view").innerHTML=`<div class="head"><h1 class="title">Users</h1></div><div class="stack">
    ${O||can("users")?"":`<p class="note">Creating logins is switched off for your login. You can change your own password below.</p>`}
    ${O&&DB.users.some(u=>u.role==="staff")?`<p class="note">Tap <b>Rights</b> next to an Admin to choose what they may do. Only what your plan includes is shown.</p>`:""}
    <form class="card" id="uForm" style="max-width:900px" ${O||can("users")?"":"hidden"}><h2>Create a login</h2><p class="note">Create the login here and give the ID and password to the person. <b>Admin</b> can do everything — billing, bills, reports, products, users and settings — except see the correction log and verify bills. <b>Owner</b> sees everything.</p>
      <div class="row"><div class="field"><label for="uName">Person's name</label><input id="uName" maxlength="60" required></div><div class="field"><label for="uUser">Login ID</label><input id="uUser" placeholder="e.g. ravi" autocomplete="off" required></div>
        <div class="field"><label for="uPw">Password (6+)</label><input id="uPw" autocomplete="new-password" required></div>
        ${O?`<div class="field" style="flex:0 1 130px"><label for="uRole">Role</label><select id="uRole"><option value="staff">Admin</option><option value="admin">Owner</option></select></div>`:""}
        <button class="btn primary">Create login</button></div></form>
    <div class="card" style="padding:0"><div class="tw"><table><thead><tr><th>Name</th><th>Login ID</th><th>Role</th><th>Status</th><th class="r">Bills</th><th>Last bill</th><th>Change password</th><th></th></tr></thead><tbody id="uList">
      ${us.map(u=>`<tr data-id="${u.id}"><td><b>${esc(u.name)}</b>${u.id===me.id?' <span class="note">(you)</span>':""}</td><td class="num">${esc(u.username)}</td><td><span class="role ${u.role==="admin"?"admin":""}">${roleName(u.role)}</span></td>
        <td>${u.active?'<span class="pill green">Active</span>':'<span class="pill red">Switched off</span>'}</td><td class="r num">${DB.bills.filter(b=>b.created_by===u.id).length}</td><td class="num">${lastBill(u.id)}</td>
        <td>${canEdit(u)||u.id===me.id?`<div class="row" style="flex-wrap:nowrap;gap:6px"><input class="inp" data-pw placeholder="New password" autocomplete="new-password" style="width:140px" aria-label="New password for ${esc(u.name)}"><button class="btn sm" data-setpw>Set</button></div>`:`<span class="note">Only the owner can change this</span>`}</td>
        <td style="white-space:nowrap">${u.id!==me.id&&canEdit(u)?`${O?`<button class="btn sm" data-role>Make ${u.role==="admin"?"Admin":"Owner"}</button> `:""}<button class="btn sm ${u.active?"danger":""}" data-toggle>${u.active?"Switch off":"Switch on"}</button>`:""}${RG&&u.role==="staff"?` <button class="btn sm" data-rights>Rights${limited(u)?` (${limited(u)} off)`:""}</button>`:""}</td></tr>`).join("")}
    </tbody></table></div></div><p class="note">Switching off a login stops that person from logging in. Their old bills stay in the reports under their name.</p></div>`;
  $("uForm").onsubmit=e=>{e.preventDefault();const name=$("uName").value.trim(),username=$("uUser").value.trim(),pw=$("uPw").value;let err=validUser(name,username,pw);
    if(!err&&DB.users.some(u=>u.username.toLowerCase()===username.toLowerCase()))err=`Login ID ${username} is already taken.`;if(err){toast(err,true);return}
    const role=O&&$("uRole")&&$("uRole").value==="admin"?"admin":"staff";
    if(role==="staff"&&!has("multiuser")&&DB.users.some(u=>u.role==="staff"&&u.active)){toast("This shop's plan allows one Admin login. Switch the old one off first, or ask your support person to add 'More than one Admin login'.",true);return}
    addUser(name,username,pw,role);renderUsers();toast(`${roleName(role)} login created for ${name}. Give them ID “${username}” and the password.`)};
  $("uList").onclick=e=>{const tr=e.target.closest("tr");if(!tr)return;const u=userById(+tr.dataset.id);
    if(e.target.closest("[data-rights]")&&RG){openModal(`<h2>What ${esc(u.name)} can do</h2><p class="note">Untick what this Admin should not do. Billing with fixed rates always works. Changes apply at once.</p>
      <div class="rights">${rightsOffered().map(k=>[k,RIGHTS[k]]).map(([k,v])=>`<label><input type="checkbox" data-r="${k}" ${rightOn(u,k)?"checked":""}> <span>${v}${RIGHT_OFF_BY_DEFAULT[k]?' <span class="note">(owner only unless ticked)</span>':""}</span></label>`).join("")}</div>
      <div class="row"><button class="btn primary" id="rtSave" type="button" style="flex:1">Save</button><button class="btn" id="rtAll" type="button">Tick all</button><button class="btn" data-close type="button">Cancel</button></div>`);
      $("rtAll").onclick=()=>document.querySelectorAll("[data-r]").forEach(c=>c.checked=true);
      $("rtSave").onclick=()=>{const before={...(u.rights||{})},r={};document.querySelectorAll("[data-r]").forEach(c=>{const k=c.dataset.r;if(RIGHT_OFF_BY_DEFAULT[k]){if(c.checked)r[k]=true}else if(!c.checked)r[k]=false});
        Object.keys(before).forEach(k=>{if(!rightsOffered().includes(k)&&k!=="reports")r[k]=before[k]});   /* keep choices for features not in the plan now */
        const was={rights:before},now={rights:r};const ch=Object.keys(RIGHTS).filter(k=>rightOn(was,k)!==rightOn(now,k)).map(k=>[RIGHTS[k],rightOn(was,k)?"On":"Off",rightOn(now,k)?"On":"Off"]);
        if(Object.keys(r).length)u.rights=r;else delete u.rights;if(ch.length)act("user",`Rights changed for ${u.name} (${u.username})`,{ref:u.id,changes:ch});save();closeModal();renderUsers();toast(ch.length?`Saved — ${limited(u)} right${limited(u)===1?"":"s"} switched off for ${u.name}`:"No change")};return}
    if(!canEdit(u)&&u.id!==me.id){toast("Only the owner can change an owner login.",true);return}
    const owners=DB.users.filter(x=>x.role==="admin"&&x.active).length;const lastOwner=u.role==="admin"&&u.active&&owners<=1;
    if(e.target.closest("[data-setpw]")){const pw=tr.querySelector("[data-pw]").value;if(pw.length<6){toast("Password must be at least 6 characters.",true);return}u.salt=Math.random().toString(36).slice(2,8);u.pw=hashPw(pw,u.salt);act("user",`Password changed for ${u.name} (${u.username})`,{ref:u.id});save();tr.querySelector("[data-pw]").value="";toast(`Password changed for ${u.name}.`)}
    const adminLimit=x=>!has("multiuser")&&DB.users.some(o=>o.id!==x.id&&o.role==="staff"&&o.active);
    if(e.target.closest("[data-toggle]")&&!u.active&&u.role==="staff"&&adminLimit(u)){toast("This shop's plan allows one Admin login. Switch the other one off first.",true);return}
    if(e.target.closest("[data-role]")&&u.role==="admin"&&u.active&&adminLimit(u)){toast("This shop's plan allows one Admin login.",true);return}
    if(e.target.closest("[data-toggle]")){if(lastOwner){toast("Keep at least one active owner.",true);return}u.active=!u.active;act("user",`${u.name} (${u.username}) ${u.active?"switched on — can log in again":"switched off — can no longer log in"}`,{ref:u.id,del:!u.active});save();renderUsers();toast(`${u.name} ${u.active?"can log in again":"can no longer log in"}.`)}
    if(e.target.closest("[data-role]")&&O){if(lastOwner){toast("Keep at least one active owner.",true);return}u.role=u.role==="admin"?"staff":"admin";act("user",`${u.name} (${u.username}) is now ${roleName(u.role)}`,{ref:u.id,changes:[["Role",roleName(u.role==="admin"?"staff":"admin"),roleName(u.role)]]});save();renderUsers();toast(`${u.name} is now ${roleName(u.role)}.`)}};
}

      ${ALL_OPTIONS.some(m=>!modeInPlan(m))?`<p class="note">Greyed options are not part of this shop's plan: ${ALL_OPTIONS.filter(m=>!modeInPlan(m)).join(", ")}. Your ticks are kept and come back when the plan includes them.</p>`:""}

      const n=$("sPrint").value==="normal",p=n?$("sPage").value:$("sPaper").value;const keep=DB.settings.thermal_size,keepR=DB.settings.print_rate;DB.settings.thermal_size=$("sTs").value;DB.settings.print_rate=$("sRate").value!=="no";const h=receiptHTML(b,true,p);DB.settings.thermal_size=keep;if(keepR===undefined)delete DB.settings.print_rate;else DB.settings.print_rate=keepR;printReceipt(h,p)}}

/* owner chooses the printer: thermal roll or normal (A4/A5) — bills, payment slips and the day summary follow it */
function printBox(s,O){const m=s.print_mode||"thermal";const nm=m==="normal"?`Normal printer — ${s.page||"A4"} page`:`Thermal printer — ${s.paper||"80"} mm roll`;

    <div class="row"><div class="field" id="sPaperF"><label for="sPaper">Thermal roll width</label><select id="sPaper"><option value="80" ${s.paper!=="58"?"selected":""}>80 mm (3 inch)</option><option value="58" ${s.paper==="58"?"selected":""}>58 mm (2 inch)</option></select></div>
      <div class="field" id="sTsF"><label for="sTs">Thermal text size</label><select id="sTs">${[["N","Normal"],["L","Large (recommended)"],["X","Extra large"],["XX","Biggest"]].map(([v,t])=>`<option value="${v}" ${(s.thermal_size||"L")===v?"selected":""}>${t}</option>`).join("")}</select></div>

    <p class="note"><b>A5 landscape</b> is printed sideways: wide columns, so item names stay on one line. Load A5 paper (or A4 cut in half) and pick <b>A5</b> + <b>Landscape</b> in the print screen.</p>

/* Settings → Plan & support */
function planCard(O){const P=planInfo(),till=P.till?dmy(P.till):"";
  const st=P.locked?"Billing stopped":{trial:"Free trial",active:"Active",basic:"Basic (trial over)",expired:"Ended — Basic",cancelled:"Cancelled — Basic",demo:"Sample data"}[P.state];
  if(!O)return `<div class="card"><h2>Plan</h2><p class="note"><b>${esc(P.name)}</b>${till?` · support till ${till}`:""}. Only the owner can change the plan.</p></div>`;

    <div class="field"><label>Shop ID</label><div class="row" style="align-items:center"><span class="reqcode" style="font-size:18px;padding:6px 10px;flex:1">${shopIdLabel(DB.shop_id)}</span><button type="button" class="btn sm" id="plSend">Send to support</button></div></div>
    <p class="note">This device: <b class="num">${deviceLabel()}</b></p>
    <div class="featlist">${Object.entries(FEATURES).map(([k,v])=>`<div class="${P.features.has(k)?"on":"off"}">${P.features.has(k)?"✓":"—"} ${esc(v)}</div>`).join("")}
      ${Object.entries(ADDONS).map(([k,v])=>`<div class="${P.features.has(k)?"on":"off"}">${P.features.has(k)?"✓":"—"} ${esc(v)} <span class="note">(add-on: only when allotted by your support person)</span></div>`).join("")}
      <div class="on">✓ Cash billing, thermal printing, products, backup — and all old bills, dues, reports and logs, always</div></div>
    <div class="field"><label for="plCode">Plan code from your support person</label><textarea id="plCode" rows="2" spellcheck="false" autocapitalize="off" placeholder="Paste the plan code here"></textarea></div>

    ${checkinURL()?`<p class="note">When this phone is online, CB tells your support person that it is in use: shop ID, shop name, version, plan and how many bills were made. No customer names, amounts or bill details are sent.</p>`:""}</div>`}
function bindPlanCard(){if(!$("plGo"))return;

    try{await navigator.clipboard.writeText(msg);toast("Copied — paste it in WhatsApp to your support person")}catch(e){location.href="https://wa.me/?text="+encodeURIComponent(msg)}};
  $("plGo").onclick=()=>{const pl=readPlanCode($("plCode").value);
    if(!pl){toast("That plan code isn't valid. Check you pasted all of it.",true);return}
    if(pl.s!==DB.shop_id){toast(`That code is for shop ID ${shopIdLabel(pl.s)}, not this phone (${shopIdLabel(DB.shop_id)}).`,true);return}
    if(pl.e&&planToday()>pl.e){toast(`That plan code ended on ${dmy(pl.e)}. Ask your support person for a new one.`,true);return}

    {const was=planInfo().name;DB.plan_code=pl.raw;act("plan",`Plan activated: ${pl.n}${pl.t?` · support till ${dmy(pl.t)}`:""}`,{changes:[["Plan",was,pl.n]]})}save();planCache.key=null;render();toast(`Plan activated: ${pl.n}${pl.e?` · features till ${dmy(pl.e)}`:""}${pl.t?` · support till ${dmy(pl.t)}`:""}`);checkin(true)}}
const gstAllowed=k=>k==="none"||(k==="composition"&&has("gst_comp"))||(k==="regular"&&has("gst_reg"));
function gstCard(s,O){const t=s.gst_type||"none";const nm={none:"Not registered for GST",composition:"Composition scheme",regular:"Regular GST (tax invoice)"};
  if(!O)return `<div class="card"><h2>GST</h2><p class="note"><b>${nm[t]}</b>${t!=="none"?` · GSTIN ${esc(s.gstin)}`:""}${t==="regular"?` · rates ${s.gst_incl!==false?"include":"exclude"} GST`:""}. Only the owner can change this.</p></div>`;
  return `<form class="card" id="gForm"><h2>GST</h2>
    <div class="field"><label for="gType">This shop is</label><select id="gType">${Object.entries(nm).filter(([k])=>gstAllowed(k)||k===t).map(([k,v])=>`<option value="${k}" ${t===k?"selected":""}>${v}</option>`).join("")}</select></div>
    ${t!=="none"&&!gstAllowed(t)?`<p class="note bad">${nm[t]} is not in this shop's plan any more. Billing continues so your invoices stay legal — ask your support person to renew it.</p>`:""}
    ${!gstAllowed("composition")||!gstAllowed("regular")?`<p class="note">GST options not in this shop's plan are hidden: ${["composition","regular"].filter(k=>!gstAllowed(k)).map(k=>nm[k]).join(", ")}.</p>`:""}
    <div id="gMore"><div class="field"><label for="gGstin">Your GSTIN (15 characters)</label><input id="gGstin" maxlength="15" autocapitalize="characters" spellcheck="false" style="text-transform:uppercase;font-family:var(--mono,monospace)" value="${esc(s.gstin||"")}" placeholder="27ABCDE1234F1Z5"><p id="gHint" class="note"></p></div>
    <div id="gRegOnly"><div class="field"><label for="gIncl">Product rates are</label><select id="gIncl"><option value="incl" ${s.gst_incl!==false?"selected":""}>Including GST (MRP / counter price)</option><option value="excl" ${s.gst_incl===false?"selected":""}>Excluding GST (GST added on top)</option></select></div>
    <p class="note">Including: a ₹118 item at 18% is ₹100 + ₹18 GST, customer pays ₹118. Excluding: a ₹100 item at 18% becomes ₹118 on the bill.</p>
    <p class="note"><b>Every product must have its HSN code and GST rate</b> (Products page). Items at different rates — say rice at 5% and soap at 18% — can be on the same bill: GST is worked out item by item, each line shows its HSN and rate, and the bill ends with a rate-wise CGST/SGST (or IGST) summary. IGST is charged automatically when the buyer's GSTIN or state is of another state.</p>
    <p class="note">For tax invoices, choose <b>Bill numbers → Continue through the financial year</b> above (GST Rule 46 asks for one running series per year).</p></div>
    <p class="note" id="gCompNote">${t==="composition"?"Composition dealers can't collect GST. Bills print as <b>BILL OF SUPPLY</b> with the required line, and the Day end report shows turnover for your quarterly CMP-08.":""}</p></div>
    <p class="note">Changing this affects new bills only. Old bills keep the GST they were made with.</p>
    <div><button class="btn primary">Save GST</button></div></form>`}
/* ============================================================ install as app, auto-lock, start-up */
let installEvt=null;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;document.querySelectorAll(".install-app").forEach(b=>b.hidden=false)});
addEventListener("appinstalled",()=>{installEvt=null;document.querySelectorAll(".install-app").forEach(b=>b.hidden=true);toast("Installed — open CB from the home screen")});
document.addEventListener("click",async e=>{if(!e.target.closest(".install-app")||!installEvt)return;installEvt.prompt();await installEvt.userChoice;installEvt=null;document.querySelectorAll(".install-app").forEach(b=>b.hidden=true)});
/* Owner login locks itself after 10 minutes without use, so the admin can't continue as owner */
/* Owner login locks itself after the time the owner chose (Settings) without use. A refresh or reopening the app
   inside that time keeps you logged in; after it, the owner logs in again — so the admin can't carry on as owner. */
const lockMin=()=>{const v=num(DB&&DB.settings?DB.settings.owner_lock:30);return v>=0?v:30};
let lastAct=Date.now(),lastSaved=0;const markAct=()=>{lastAct=Date.now();if(lastAct-lastSaved>10000){lastSaved=lastAct;LS.set("lastAct",lastAct)}};
["pointerdown","keydown","touchstart"].forEach(ev=>addEventListener(ev,markAct,{passive:true}));
addEventListener("pagehide",()=>LS.set("lastAct",lastAct));
setInterval(()=>{const m=lockMin();if(me&&isOwner()&&m>0&&Date.now()-lastAct>m*60*1000){me=null;LS.del("session");closeModal();render();toast(`Owner login locked after ${m} minutes without use. Log in again.`)}},20000);
/* who is still logged in when the app opens again */
function restoreSession(){const sid=LS.get("session",null),u=sid&&userById(sid);if(!u||!u.active)return null;
  if(u.role==="admin"){const m=lockMin(),t=num(LS.get("lastAct",0));if(m>0&&!(t&&Date.now()-t<m*60*1000)){LS.del("session");return null}}
  return u}
/* Only one copy of the app may be in use at a time, so two windows can't overwrite each other's bills */
const BC=("BroadcastChannel" in self)?new BroadcastChannel("counter-bill"):null;let otherOpen=false;
if(BC)BC.onmessage=e=>{
  if(e.data==="hello"&&!blocked)BC.postMessage("here");
  if(e.data==="here")otherOpen=true;
  if(e.data==="takeover"&&!blocked){if(saveTimer)flush();showBlocked()}};
function showBlocked(){blocked=true;closeModal();
  $("app").innerHTML=`<div class="wrap"><div class="authwrap"><div class="card authcard"><h1 class="title">CB is open in another window</h1>
    <p class="note">To keep bills safe, only one window can be used at a time. Close this one, or tap below to use it here instead (the other window will stop).</p>
    <button class="btn primary" id="useHere" style="padding:11px">Use it here</button></div></div></div>`;
  $("useHere").onclick=takeOver}
async function loadDB(){DB=null;try{if(!IDB.db)await IDB.open();idbOK=true;const raw=await IDB.get("db");if(raw)DB=JSON.parse(raw)}catch(e){idbOK=false}}
async function takeOver(){if(BC)BC.postMessage("takeover");await new Promise(r=>setTimeout(r,400));await loadDB();if(!DB)DB=blankDB();upgradeDB();blocked=false;
  me=restoreSession();Bill.load();view="billing";render()}
/* ask the browser to keep CB's data permanently (it is then not cleared on its own when the phone runs low on space).
   Chrome grants it more easily once CB is installed as an app or used often, so we ask again at login and when bills are made. */
let keepState=null;
const backupDays=()=>[1,3,7].includes(+S().backup_days)?+S().backup_days:7;
async function keepData(){try{if(!navigator.storage||!navigator.storage.persist)return keepState="na";if(await navigator.storage.persisted())return keepState="yes";keepState=(await navigator.storage.persist())?"yes":"no"}catch(e){keepState="na"}return keepState}
async function boot(){
  if(BC){BC.postMessage("hello");await new Promise(r=>setTimeout(r,350));if(otherOpen){showBlocked();return}}
  await loadDB();
  if(!DB){const old=LS.get("db",null);if(old&&old.users)DB=old}
  if(!DB)DB=blankDB();upgradeDB();
  keepData();
  me=restoreSession();if(me){LS.set("lastAct",Date.now());const v=LS.get("view_"+me.id,"billing");view=VIEWS[v]&&viewOK(v)?v:"billing"}   /* a refresh keeps you on the same page */
  Bill.load();render();
  dailyBackup();setInterval(dailyBackup,60000);
  setTimeout(()=>{checkin();fetchRevoked()},5000);addEventListener("online",()=>{checkin();fetchRevoked()});setInterval(()=>{checkin();fetchRevoked()},3600000);   /* also catches midnight if the app stays open */
  if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
}
boot();
