<style id="pageStyle">@page{margin:0}</style>
<style>
/* Layout: shop counter — bill sheet left, department shelf right; admin pages as stacked cards */
:root{
  --bg:#eef1f0; --paper:#ffffff; --ink:#15211f; --muted:#5d6b68; --line:#d6dddb; --soft:#e4eae8;
  --accent:#0d6b5f; --accent-ink:#ffffff; --accent-soft:#d8ece8; --mark:#e9a227; --mark-soft:#fbefd6;
  --danger:#b3392f; --danger-soft:#f8e1de; --scrim:rgba(10,20,18,.45);
  --roll:#ffffff; --roll-ink:#000000;
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  --f-num:ui-monospace,"Roboto Mono","SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1514; --paper:#18201f; --ink:#e6eeec; --muted:#93a29f; --line:#2b3735; --soft:#212b29;
  --accent:#3fb8a6; --accent-ink:#06201c; --accent-soft:#16332f; --mark:#f0b54a; --mark-soft:#3a2f17;
  --danger:#ef7b70; --danger-soft:#3b1d1a; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1514; --paper:#18201f; --ink:#e6eeec; --muted:#93a29f; --line:#2b3735; --soft:#212b29;
  --accent:#3fb8a6; --accent-ink:#06201c; --accent-soft:#16332f; --mark:#f0b54a; --mark-soft:#3a2f17;
  --danger:#ef7b70; --danger-soft:#3b1d1a; --scrim:rgba(0,0,0,.6); color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav{background:var(--paper);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:10px;max-width:1440px;margin:0 auto}
.brand{font-weight:800;font-size:17px;letter-spacing:-.01em}
.nav nav{display:flex;gap:2px;flex-wrap:wrap;flex:1;min-width:0}
.nav nav button{border:0;background:transparent;padding:7px 11px;border-radius:7px;color:var(--muted);font-weight:600}
.nav nav button:hover{background:var(--soft);color:var(--ink)}
.nav nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.me{display:flex;align-items:center;gap:8px;font-weight:600}
.role{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:3px 8px;border-radius:99px;background:var(--soft);color:var(--muted)}
.role.admin{background:var(--ink);color:var(--paper)}
.demo{background:var(--mark-soft);border-bottom:1px solid var(--mark);font-size:12.5px}
.demo .wrap{max-width:1440px;margin:0 auto;padding-block:7px}
main.page{max-width:1440px;margin:0 auto;padding-block:14px}

.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 12px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.armed,.btn.danger.solid{background:var(--danger);color:var(--paper);border-color:var(--danger)}
.btn:disabled{opacity:.55;cursor:default}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.field input,.field select,.field textarea,.inp{border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--bg);min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row .field{flex:1 1 140px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2,.card h3{margin:0}
.card h2{font-size:17px}
.card h3{font-size:14px}
.note{color:var(--muted);font-size:12.5px;line-height:1.5;margin:0}
h1.title{font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.stack{display:flex;flex-direction:column;gap:14px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.seg{display:inline-flex;background:var(--soft);border-radius:8px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:6px;padding:7px 12px;font-weight:700;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.14);color:var(--accent)}
.pill{display:inline-block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:99px;background:var(--mark-soft);color:var(--ink);vertical-align:1px}
.pill.red{background:var(--danger-soft);color:var(--danger)}
.pill.green{background:var(--accent-soft);color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-weight:600;z-index:60;max-width:calc(100% - 40px);text-align:center}
.toast.err{background:var(--danger)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:var(--paper);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--soft);vertical-align:middle}
.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--bg)}
tr.sel td{background:var(--accent-soft)}
tr.cx td{color:var(--muted);text-decoration:line-through}
tfoot td{font-weight:700;border-top:1px solid var(--line)}
.empty{padding:32px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* Billing */
.billing{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:14px;height:clamp(580px,calc(100vh - 150px),1100px)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-width:0;min-height:0}
.corrbar{background:var(--mark-soft);border-bottom:1px solid var(--mark);padding:12px 16px;display:flex;flex-direction:column;gap:8px;border-radius:12px 12px 0 0}
.corrbar .t{font-weight:800}
.corrbar .t span{font-weight:500;color:var(--muted)}
.corrbar input{flex:1 1 220px;border:1px solid var(--mark);border-radius:6px;padding:8px 10px;background:var(--paper)}
.billhead{display:flex;flex-wrap:wrap;gap:10px 16px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:flex-end}
.billhead .field input{padding:6px 8px}
.billno{font-size:15px;font-weight:600;padding:6px 0}
.grow{flex:1 1 150px}
.tablewrap{overflow:auto;flex:1;min-height:150px}
.tablewrap th{position:sticky;top:0;z-index:1}
td.sn{color:var(--muted);width:28px}
td.item{font-weight:600;min-width:110px}
td.item small{display:block;font-weight:500;color:var(--muted);font-size:11px}
td input{width:76px;border:1px solid var(--line);border-radius:6px;padding:5px 6px;background:var(--bg);text-align:right;font-family:var(--f-num)}
td input.edited{background:var(--mark-soft);border-color:var(--mark)}
td select{border:1px solid var(--line);border-radius:6px;padding:5px 4px;background:var(--bg)}
.del{border:0;background:transparent;color:var(--muted);font-size:19px;line-height:1;padding:4px 7px;border-radius:6px}
.del:hover{color:var(--danger);background:var(--soft)}
.ratecell{display:flex;align-items:center;gap:4px;justify-content:flex-end}
.reset{border:0;background:transparent;color:var(--mark);font-size:13px;font-weight:800;padding:2px}
tr.flash-row td{animation:rowflash 1.2s ease-out}
@keyframes rowflash{from{background:var(--accent-soft)}to{background:transparent}}
.totals{border-top:1px solid var(--line);padding:10px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center}
.totals .l{color:var(--muted)}
.totals input{width:96px;border:1px solid var(--line);border-radius:6px;padding:5px 6px;background:var(--bg);text-align:right;font-family:var(--f-num)}
.grand{font-size:26px;font-weight:700;color:var(--accent)}
.grandl{font-weight:800;font-size:15px}
.words{grid-column:1/-1;font-size:12px;color:var(--muted);font-style:italic}
.billact{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 14px;align-items:center}
.billact .primary{flex:1 1 160px;padding:12px;font-size:14px}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600}
.cathead{padding:12px 14px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.searchrow{display:flex;gap:8px;align-items:stretch}
.search{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--bg);width:100%;min-width:0;flex:1}
.mic{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;width:46px;display:grid;place-items:center;flex:none;position:relative}
.mic svg{width:20px;height:20px}
.mic.live{background:var(--danger);border-color:var(--danger)}
.mic.live::after{content:"";position:absolute;inset:-4px;border-radius:11px;border:2px solid var(--danger);animation:pulse 1.1s ease-out infinite}
@keyframes pulse{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.18)}}
.voiceopts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.voicebox{border:1px dashed var(--accent);border-radius:9px;padding:9px 11px;display:flex;flex-direction:column;gap:7px;background:var(--accent-soft)}
.voicebox .heard{font-size:13px}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choices button{border:1px solid var(--accent);background:var(--paper);border-radius:99px;padding:6px 11px;font-weight:600;font-size:12.5px}
.say{display:flex;gap:6px}
.say input{flex:1;min-width:0;border:1px dashed var(--line);border-radius:7px;padding:7px 9px;background:var(--bg);font-size:12.5px}
.depts{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.dept{flex:none;border:1px solid var(--line);background:transparent;border-radius:99px;padding:6px 12px;font-weight:600;font-size:12.5px;white-space:nowrap}
.dept span{color:var(--muted);font-weight:500;margin-left:4px}
.dept[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dept[aria-pressed="true"] span{color:inherit;opacity:.7}
.grid{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:14px;min-height:200px}
.group h3{margin:0 0 7px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.tile{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 10px;display:flex;flex-direction:column;gap:6px;transition:border-color .12s,transform .08s}
.tile:hover{border-color:var(--accent)}
.tile:active{transform:scale(.97)}
.tile .n{font-weight:600;font-size:13px;line-height:1.25}
.tile .p{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:12px;color:var(--muted)}
.tile .p b{color:var(--ink);font-family:var(--f-num);font-weight:600;font-size:13px}
.tile.inbill{border-color:var(--accent);background:var(--accent-soft)}
.catfoot{padding:9px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.switch{display:none;background:var(--soft);border-radius:10px;padding:4px;gap:4px;margin-bottom:10px}
.switch button{flex:1;border:0;background:transparent;padding:9px;border-radius:7px;font-weight:700}
.switch button[aria-pressed="true"]{background:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-family:var(--f-num);font-size:20px;font-weight:600}
.stat span{font-size:12px;color:var(--muted)}
.stat.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stat.hero span{color:inherit;opacity:.85}
.twocol{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:14px;align-items:start}
.bar{height:6px;border-radius:3px;background:var(--accent);min-width:2px}
.barcell{width:28%}
.down{color:var(--danger)}
.up{color:var(--accent)}
.logentry{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.loghead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 12px;background:var(--bg);align-items:baseline}
.loghead b{font-size:14px}
.loghead small{color:var(--muted);font-size:12px}
.logbody{padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.reason{font-size:13px}
.reason span{color:var(--muted)}
.chg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:13px}
.chg li{padding-left:16px;position:relative}
.chg li::before{position:absolute;left:0;font-weight:800;font-family:var(--f-num)}
.chg li.add::before{content:"+";color:var(--accent)}
.chg li.del::before{content:"−";color:var(--danger)}
.chg li.chg::before,.chg li.info::before{content:"~";color:var(--mark)}
.netchg{font-family:var(--f-num);font-size:13px;font-weight:600}

/* Receipt — always paper white, like the roll */
.rprev{background:var(--soft);border-radius:10px;padding:14px;display:flex;justify-content:center;overflow-x:auto}
.rcpt{background:var(--roll);color:var(--roll-ink);font-family:"Courier New",Courier,var(--f-num);line-height:1.3;flex:none;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.rcpt.w80{width:80mm;padding:3mm 4mm;font-size:12px}
.rcpt.w58{width:58mm;padding:2mm 2.5mm;font-size:10.5px}
.rcpt .c{text-align:center}.rcpt .b{font-weight:700}.rcpt .big{font-size:1.35em}
.rcpt .hr{border-top:1px dashed var(--roll-ink);margin:1.6mm 0}
.rcpt .lr{display:flex;justify-content:space-between;gap:2mm}
.rcpt .lr span:last-child{text-align:right;white-space:nowrap}
.rcpt .it{font-weight:700;word-break:break-word}
.rcpt .net{font-size:1.3em;font-weight:700}
.rcpt .tag{border:1px solid var(--roll-ink);text-align:center;font-weight:700;padding:.5mm;margin:1mm 0}
.rcpt .void{font-size:1.6em;text-align:center;font-weight:700;border:2px solid var(--roll-ink);margin:1mm 0}
.rcpt .pre{white-space:pre-line}
.rcpt .pl{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:2mm;white-space:nowrap}
.rcpt .pl span:first-child{overflow:hidden;text-overflow:ellipsis}
.rcpt .pl span:nth-child(2),.rcpt .pl span:nth-child(3){text-align:right}
.rcpt .pl span:nth-child(3){min-width:15mm}

.overlay{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:calc(28px + env(safe-area-inset-top,0px)) 12px calc(28px + env(safe-area-inset-bottom,0px))}
.modal{background:var(--paper);border-radius:14px;width:min(460px,100%);padding:18px;display:flex;flex-direction:column;gap:14px}
.modal h2{margin:0;font-size:18px}
.authwrap{min-height:calc(100vh - 40px);display:grid;place-items:center;padding-block:24px}
.authcard{width:min(420px,100%)}
.creds{display:grid;grid-template-columns:auto auto auto;gap:4px 14px;font-size:12.5px;background:var(--bg);border-radius:8px;padding:10px 12px}
.creds b{font-family:var(--f-num);font-weight:600}

@media (max-width:900px){
  .billing{grid-template-columns:minmax(0,1fr);height:auto}
  .switch{display:flex}
  .billing[data-view="bill"] .catalog{display:none}
  .billing[data-view="cat"] .bill{display:none}
  .panel{min-height:70vh}
  .split{grid-template-columns:minmax(0,1fr)}
  td input{width:62px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.pill.blue{background:var(--accent-soft);color:var(--accent)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:99px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;text-align:center;margin-left:4px}
.warnbar{background:var(--danger-soft);border-bottom:1px solid var(--danger);font-size:12.5px}
.warnbar .wrap{max-width:1440px;margin:0 auto;padding-block:7px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#printArea{display:none}
@media print{
  :root{padding:0!important}
  body{background:#fff!important;color:#000!important}
  body.print-rcpt>*:not(#printArea){display:none!important}
  body.print-rcpt #printArea{display:block!important}
  body.print-rcpt #printArea .rcpt{box-shadow:none}
  body:not(.print-rcpt) .nav,body:not(.print-rcpt) .demo,body:not(.print-rcpt) .warnbar,body:not(.print-rcpt) .noprint,body:not(.print-rcpt) .toast{display:none!important}
  .card,.stat{break-inside:avoid}
}

/* ============================================================ helpers */
const $=id=>document.getElementById(id);

function totalsOf(items,discount){const sub=r2(items.reduce((s,i)=>s+i.amount,0));const disc=r2(Math.min(Math.max(num(discount),0),sub));const after=r2(sub-disc);const net=r0(after);return{subtotal:sub,discount:disc,round_off:r2(net-after),net}}
const S=()=>DB.settings;
const userById=id=>DB.users.find(u=>u.id===id);
const uname=id=>(userById(id)||{}).name||"—";
/* Bill numbers: "daily" restarts at 1 every day and carries the date (15-10-26/1); "fy" runs through the financial year (26-27/1).
   Each bill remembers its own series, so changing the setting never renumbers old bills. */
const shortDate=d=>`${d.slice(8,10)}-${d.slice(5,7)}-${d.slice(2,4)}`;
const label=b=>b.series==="daily"?`${shortDate(b.bill_date)}/${b.no}`:`${b.fy}/${b.no}`;
function nextNumber(date){const series=(DB.settings.numbering||"daily")==="fy"?"fy":"daily",fy=fyOf(date);
  const same=series==="daily"?DB.bills.filter(b=>b.series==="daily"&&b.bill_date===date):DB.bills.filter(b=>b.series!=="daily"&&b.fy===fy);
  return{series,fy,no:Math.max(0,...same.map(b=>b.no))+1}}

/* ============================================================ business rules (mirror app.py) */
function buildItems(raw,oldBase){
  if(!raw||!raw.length)throw new Bad("Add at least one item.");
  const ob={};Object.entries(oldBase||{}).forEach(([k,v])=>ob[k]=v.slice());
  const out=[];
  raw.forEach(i=>{const p=DB.products.find(x=>x.id===i.product_id);if(!p)throw new Bad("A product on this bill no longer exists. Remove it and add it again.");
    const qty=+num(i.qty).toFixed(3),rate=r2(num(i.rate));if(qty<=0)return;if(qty>100000)throw new Bad(`Check the quantity for ${p.name}.`);if(rate<0)throw new Bad(`Rate for ${p.name} can't be negative.`);
    const unit=UNITS.includes(i.unit)?i.unit:p.unit;const bases=ob[p.id];const base=bases&&bases.length?bases.shift():p.rate;
    out.push({product_id:p.id,name:p.name,dept:p.dept,unit,qty,rate,base_rate:base,amount:r2(qty*rate),pos:out.length})});
  if(!out.length)throw new Bad("Add at least one item with a quantity.");return out}
function cleanHeader(d){return{customer:String(d.customer||"").trim().slice(0,80),phone:String(d.phone||"").replace(/[^0-9+ \-]/g,"").slice(0,20),paymode:PAYMODES.includes(d.paymode)?d.paymode:"Cash"}}
function canCorrect(b){if(b.status!=="active")return[false,"This bill is cancelled."];if(isOwner())return[true,""];const rule=S().staff_correct;if(rule==="any")return[true,""];if(rule==="today"&&b.bill_date===today())return[true,""];return[false,rule==="none"?"Only the owner can correct saved bills.":"Only today's bills can be corrected. Ask the owner."]}
function createBill(d){const items=buildItems(d.items);const h=cleanHeader(d);const t=totalsOf(items,d.discount);const date=today();const{series,fy,no}=nextNumber(date);
  const b={id:nextId(),fy,no,series,bill_date:date,created_at:stamp(),created_by:me.id,...h,...t,rev:0,updated_at:null,updated_by:null,status:"active",items};DB.bills.push(b);save();return b}
function diffBill(old,nb){const ch=[],pool={};old.items.forEach(o=>(pool[o.product_id]=pool[o.product_id]||[]).push(o));
  nb.items.forEach(n=>{const arr=pool[n.product_id];const o=arr&&arr.length?arr.shift():null;
    if(!o){ch.push({t:"add",s:`Added ${n.name} — ${fq(n.qty)} ${n.unit} @ ₹${fmt(n.rate)} = ₹${fmt(n.amount)}`});return}
    const p=[];if(Math.abs(o.qty-n.qty)>1e-9)p.push(`qty ${fq(o.qty)} → ${fq(n.qty)}`);if(o.unit!==n.unit)p.push(`unit ${o.unit} → ${n.unit}`);if(Math.abs(o.rate-n.rate)>1e-9)p.push(`rate ₹${fmt(o.rate)} → ₹${fmt(n.rate)}`);
    if(p.length)ch.push({t:"chg",s:`${n.name}: ${p.join(", ")} (₹${fmt(o.amount)} → ₹${fmt(n.amount)})`})});
  Object.values(pool).forEach(arr=>arr.forEach(o=>ch.push({t:"del",s:`Removed ${o.name} — ${fq(o.qty)} ${o.unit} @ ₹${fmt(o.rate)} = ₹${fmt(o.amount)}`})));
  if(Math.abs(old.discount-nb.discount)>1e-9)ch.push({t:"chg",s:`Discount ₹${fmt(old.discount)} → ₹${fmt(nb.discount)}`});
  if(old.paymode!==nb.paymode)ch.push({t:"info",s:`Payment ${old.paymode} → ${nb.paymode}`});
  if(old.customer!==nb.customer)ch.push({t:"info",s:`Customer "${old.customer||"Cash"}" → "${nb.customer||"Cash"}"`});
  if(old.phone!==nb.phone)ch.push({t:"info",s:`Mobile "${old.phone||"—"}" → "${nb.phone||"—"}"`});return ch}
function correctBill(id,d){const b=DB.bills.find(x=>x.id===id);if(!b)throw new Bad("Bill not found.");const[ok,why]=canCorrect(b);if(!ok)throw new Bad(why);
  const ob={};b.items.forEach(o=>(ob[o.product_id]=ob[o.product_id]||[]).push(o.base_rate));
  const items=buildItems(d.items,ob);const h=cleanHeader(d);const t=totalsOf(items,d.discount);const nb={...b,...h,...t,items};
  const ch=diffBill(b,nb);if(!ch.length)throw new Bad("Nothing has changed in this bill.");
  const before=b.net;Object.assign(b,h,t,{items,rev:b.rev+1,updated_at:stamp(),updated_by:me.id});
  DB.corrections.push({id:nextId(),bill_id:b.id,at:stamp(),user_id:me.id,kind:"edit",changes:ch,before_net:before,after_net:b.net,rev:b.rev});save();return b}
function cancelBill(id){
  const b=DB.bills.find(x=>x.id===id);if(b.status!=="active")throw new Bad("This bill is already cancelled.");b.status="cancelled";b.rev++;b.updated_at=stamp();b.updated_by=me.id;
  DB.corrections.push({id:nextId(),bill_id:b.id,at:stamp(),user_id:me.id,kind:"cancel",changes:[{t:"del",s:`Bill cancelled (was ₹${Math.round(b.net).toLocaleString("en-IN")})`}],before_net:b.net,after_net:0,rev:b.rev});save();return b}
function corrView(c){const b=DB.bills.find(x=>x.id===c.bill_id);return{...c,label:b?label(b):"?",by:uname(c.user_id)}}
function dayReport(d1,d2){
  const bills=DB.bills.filter(b=>b.bill_date>=d1&&b.bill_date<=d2).sort((a,b)=>a.id-b.id);
  const act=bills.filter(b=>b.status==="active"),cx=bills.filter(b=>b.status!=="active");const sum=(a,k)=>r2(a.reduce((s,b)=>s+b[k],0));
  const s={bills:act.length,gross:sum(act,"subtotal"),discount:sum(act,"discount"),round_off:sum(act,"round_off"),net:sum(act,"net"),cancelled:cx.length,cancelled_amt:sum(cx,"net"),first:bills[0]?label(bills[0]):"",last:bills.length?label(bills[bills.length-1]):""};s.avg=act.length?r2(s.net/act.length):0;
  const pay={};PAYMODES.forEach(m=>pay[m]={bills:0,net:0});act.forEach(b=>{pay[b.paymode].bills++;pay[b.paymode].net=r2(pay[b.paymode].net+b.net)});
  const staff={};act.forEach(b=>{const n=uname(b.created_by);staff[n]=staff[n]||{bills:0,net:0};staff[n].bills++;staff[n].net=r2(staff[n].net+b.net)});
  const items={},depts={},overrides=[];
  act.forEach(b=>b.items.forEach(i=>{const k=i.name+"|"+i.unit;const it=items[k]=items[k]||{name:i.name,dept:i.dept,unit:i.unit,qty:0,amount:0,bills:new Set()};it.qty=+(it.qty+i.qty).toFixed(3);it.amount=r2(it.amount+i.amount);it.bills.add(b.id);
    const d=depts[i.dept]=depts[i.dept]||{dept:i.dept,amount:0,lines:0,items:new Set()};d.amount=r2(d.amount+i.amount);d.lines++;d.items.add(i.name);
    if(Math.abs(i.rate-i.base_rate)>.004)overrides.push({label:label(b),name:i.name,unit:i.unit,qty:i.qty,rate:i.rate,base:i.base_rate,effect:r2((i.rate-i.base_rate)*i.qty),by:uname(b.updated_by||b.created_by)})}));
  const corr=DB.corrections.filter(c=>c.at.slice(0,10)>=d1&&c.at.slice(0,10)<=d2).map(corrView);
  return{d1,d2,bills,s,pay,staff,items:Object.values(items).sort((a,b)=>b.amount-a.amount),depts:Object.values(depts).sort((a,b)=>b.amount-a.amount),overrides,overrideEffect:r2(overrides.reduce((x,o)=>x+o.effect,0)),corr,toVerify:bills.filter(b=>!isVerified(b)).length}}

function render(){
  const app=$("app");
  if(!DB.users.length){app.innerHTML=setupHTML();bindSetup();return}
  if(!me){app.innerHTML=loginHTML();bindLogin();return}
  if(ADMIN_ONLY.has(view)&&!isOwner())view="billing";
  const toVerify=isOwner()?DB.bills.filter(b=>!isVerified(b)).length:0;
  const bkAge=DB.lastBackup?Math.floor((Date.now()-new Date(DB.lastBackup.replace(" ","T")))/864e5):null;
  const needBackup=!DB.demo&&DB.bills.length>0&&(bkAge===null||bkAge>=3);
  app.innerHTML=`${DB.demo?`<div class="demo"><div class="wrap">Sample data for trying out. ${isOwner()?`When you're ready to use it for real: <button class="btn sm" id="toEmpty" style="margin-left:4px">Start with my own data</button>`:""}</div></div>`:""}
  ${needBackup?`<div class="warnbar"><div class="wrap"><span><b>Backup:</b> ${bkAge===null?"never taken":"last taken "+bkAge+" days ago"}. All bills are only on this device — if it's lost or reset, they're gone.</span><button class="btn sm" id="bkNow">Back up now</button></div></div>`:""}
  <header class="nav"><div class="wrap"><span class="brand">${esc(S().shop_name)}</span>
    <nav>${Object.entries(VIEWS).filter(([k])=>isOwner()||!ADMIN_ONLY.has(k)).map(([k,v])=>`<button data-go="${k}" ${k===view?'aria-current="page"':""}>${v}${k==="bills"&&toVerify?`<span class="badge" title="Bills to verify">${toVerify}</span>`:""}</button>`).join("")}</nav>
    <div class="me"><button class="btn sm install-app" type="button" ${installEvt?"":"hidden"}>Install app</button><span>${esc(me.name)}</span><span class="role ${isOwner()?"admin":""}">${isOwner()?"Owner":"Admin"}</span><button class="btn sm" id="logout">Log out</button></div></div></header>
  <main class="page wrap" id="view"></main>`;
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  $("logout").onclick=()=>{if(Bill.lines.length&&!Bill.editing)Bill.persist();me=null;LS.del("session");LS.set("loggedOut",true);render()};
  if($("bkNow"))$("bkNow").onclick=()=>{if(saveFile(`counter-bill-backup-${today()}.json`,JSON.stringify(DB))){DB.lastBackup=stamp();save();render()}};
  if($("toEmpty"))$("toEmpty").onclick=()=>{go("settings");setTimeout(()=>{const el=$("resetCard");if(el)el.scrollIntoView({behavior:"smooth"})},50)};
  ({billing:renderBilling,bills:renderBills,report:renderReport,log:renderLog,products:renderProducts,users:renderUsers,settings:renderSettings})[view]();
}

/* ---------- login / setup */
function loginHTML(){const demoUsers=DB.demo?DB.users.filter(u=>u.active&&["owner","ravi","ravi"].includes(u.username)):[];
  return `<div class="wrap"><div class="authwrap"><form class="card authcard" id="loginForm">
  <div><h1 class="title">${esc(S().shop_name)}</h1><p class="note">Log in with the ID your shop owner gave you.</p></div>
  <div class="field"><label for="lgUser">Login ID</label><input id="lgUser" autocomplete="username" required></div>
  <div class="field"><label for="lgPw">Password</label><input id="lgPw" type="password" autocomplete="current-password" required></div>
  <button class="btn primary" style="padding:11px">Log in</button>
  ${demoUsers.length?`<div class="creds"><span class="lbl">Demo login</span><span class="lbl">ID</span><span class="lbl">Password</span>${demoUsers.map(u=>`<span>${esc(u.name)} (${u.role==="admin"?"Owner":"Admin"})</span><b>${esc(u.username)}</b><b>${u.username==="owner"?"owner123":u.username+"123"}</b>`).join("")}</div>`:""}
  <button class="btn install-app" type="button" ${installEvt?"":"hidden"}>Install as app on this device</button>
  <p class="note ios-hint" ${isIOS()&&!standalone()?"":"hidden"}>To add an app icon: tap <b>Share</b> → <b>Add to Home Screen</b>.</p>
  <p class="note">Forgot your password? Ask the shop owner to reset it.</p></form></div></div>`}
let fails={};
function bindLogin(){$("lgUser").focus();$("loginForm").onsubmit=e=>{e.preventDefault();const id=$("lgUser").value.trim().toLowerCase(),pw=$("lgPw").value;const f=fails[id]||{n:0,until:0};
  if(f.until>Date.now()){toast("Too many wrong tries. Wait a few minutes.",true);return}
  const u=DB.users.find(x=>x.username.toLowerCase()===id&&x.active);
  if(!u||u.pw!==hashPw(pw,u.salt)){f.n++;if(f.n>=5)f.until=Date.now()+300000;fails[id]=f;toast("Wrong login ID or password.",true);return}
  delete fails[id];me=u;LS.set("session",u.id);LS.set("loggedOut",false);view="billing";Bill.load();render()}}
function setupHTML(){return `<div class="wrap"><div class="authwrap"><form class="card authcard" id="setupForm">
  <div><h1 class="title">Set up Counter Bill</h1><p class="note">Create the owner login for yourself. You'll create the admin login for the person who runs the shop after this. They never see this screen.</p></div>
  <div class="field"><label for="suShop">Shop name</label><input id="suShop" required></div>
  <div class="field"><label for="suName">Your name</label><input id="suName" required></div>
  <div class="field"><label for="suUser">Login ID</label><input id="suUser" autocomplete="username" required></div>
  <div class="field"><label for="suPw">Password (6+ characters)</label><input id="suPw" type="password" autocomplete="new-password" required></div>
  <button class="btn primary" style="padding:11px">Create owner login</button>
  <button class="btn" type="button" id="trySample">Try it first with sample data</button>
  <button class="btn install-app" type="button" ${installEvt?"":"hidden"}>Install as app on this device</button>
  <p class="note ios-hint" ${isIOS()&&!standalone()?"":"hidden"}>To add an app icon: tap <b>Share</b> → <b>Add to Home Screen</b>.</p>
  <p class="note">Works without internet. All data stays on this device.</p></form></div></div>`}
function validUser(name,username,pw,needPw=true){if(!name)return"Enter the person's name.";if(!/^[A-Za-z0-9_.\-]{3,30}$/.test(username))return"Login ID must be 3–30 letters or numbers (no spaces).";if(needPw&&(pw||"").length<6)return"Password must be at least 6 characters.";return null}
function addUser(name,username,pw,role){const salt=Math.random().toString(36).slice(2,8);const u={id:nextId(),username,name,salt,pw:hashPw(pw,salt),role,active:true,created_at:stamp()};DB.users.push(u);save();return u}
function bindSetup(){$("trySample").onclick=()=>{seedDB();me=DB.users.find(u=>u.username==="owner");Bill.load();view="billing";render();toast("Sample data loaded. Owner ID: owner / owner123, Admin: ravi / ravi123")};$("setupForm").onsubmit=e=>{e.preventDefault();const err=validUser($("suName").value.trim(),$("suUser").value.trim(),$("suPw").value);if(err){toast(err,true);return}
  DB.settings.shop_name=$("suShop").value.trim()||"My Retail Store";const u=addUser($("suName").value.trim(),$("suUser").value.trim(),$("suPw").value,"admin");me=u;LS.set("session",u.id);view="products";render();toast("Owner login created. Add your products next.")}}

/* ============================================================ billing */
const Bill={lines:[],editing:null,paymode:"Cash",dept:"All",cust:"",phone:"",disc:"0",reason:"",
  key(){return "draft_"+(me?me.id:0)},
  load(){const d=LS.get(this.key(),null);this.editing=null;if(d){this.lines=d.lines||[];this.paymode=d.paymode||"Cash";this.cust=d.cust||"";this.phone=d.phone||"";this.disc=d.disc||"0"}else{this.lines=[];this.paymode="Cash";this.cust=this.phone="";this.disc="0"}},
  persist(){if(this.editing)return;LS.set(this.key(),{lines:this.lines,paymode:this.paymode,cust:this.cust,phone:this.phone,disc:this.disc})},
  reset(){this.lines=[];this.editing=null;this.paymode="Cash";this.cust=this.phone="";this.disc="0";this.reason="";LS.del(this.key())}};
const uidk=()=>Math.random().toString(36).slice(2,9);
const activeProducts=()=>DB.products.filter(p=>p.active).sort((a,b)=>a.dept.localeCompare(b.dept)||a.name.localeCompare(b.name));

function renderBilling(){
  const v=$("view");
  v.innerHTML=`<div class="switch" role="group" aria-label="View"><button id="vBill" aria-pressed="true">Bill <span id="vBillCount"></span></button><button id="vCat" aria-pressed="false">Products</button></div>
  <div class="billing" id="billing" data-view="bill">
  <section class="panel bill" aria-label="Bill">
    <div class="corrbar" id="corrBar" hidden><div class="row" style="justify-content:space-between;align-items:center"><div class="t" id="corrTitle"></div><button class="btn" id="corrCancel">Cancel correction</button></div>
      <p class="note">Make the changes and press Save correction. Every change is recorded for the admin automatically.</p></div>
    <div class="billhead">
      <div class="field"><label>Bill no.</label><div class="billno num" id="billNo">New</div></div>
      <div class="field"><label>Date</label><div class="billno num">${dmy(today())}</div></div>
      <div class="field grow"><label for="custName">Customer</label><input id="custName" maxlength="80" placeholder="Cash / customer name"></div>
      <div class="field grow"><label for="custPhone">Mobile</label><input id="custPhone" maxlength="20" inputmode="tel" placeholder="Optional"></div>
      <div class="field"><label>Payment</label><div class="seg" id="paymode" role="group" aria-label="Payment mode">${PAYMODES.map(m=>`<button type="button" data-m="${m}">${m}</button>`).join("")}</div></div>
    </div>
    <div class="tablewrap"><table><thead><tr><th>#</th><th>Item</th><th class="r">Qty</th><th>Unit</th><th class="r">Rate ₹</th><th class="r">Total ₹</th><th></th></tr></thead><tbody id="lines"></tbody></table>
      <div class="empty" id="emptyBill"><b>No items yet</b>Tap a product, type to search, or use the mic and say the product name.</div></div>
    <div class="totals">
      <span class="l">Items <span class="num" id="tCount">0</span> · Subtotal</span><span class="num" id="tSub">0.00</span>
      <label class="l" for="disc">Discount ₹</label><input id="disc" class="num" inputmode="decimal">
      <span class="l">Round off</span><span class="num" id="tRound">0.00</span>
      <span class="l grandl">Net amount</span><span class="num grand" id="tGrand">₹0</span><span class="words" id="tWords"></span></div>
    <div class="billact"><button class="btn primary" id="saveBill">Save &amp; print</button>
      <label class="chk"><input type="checkbox" id="autoPrint"> Print after saving</label>
      <button class="btn" id="copyBill">Copy for WhatsApp</button><button class="btn danger" id="clearBill">Clear</button></div>
  </section>
  <section class="panel catalog" aria-label="Products by department">
    <div class="cathead">
      <div class="searchrow"><input class="search" id="search" type="search" placeholder="Search product… (Enter adds the first match)" aria-label="Search product" autocomplete="off">
        <button class="mic" id="mic" type="button" title="Say a product name (F2)" aria-label="Say a product name"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></svg></button></div>
      <div class="voiceopts"><span>Voice:</span><div class="seg" role="group" aria-label="Voice language"><button type="button" data-lang="en-IN">English</button><button type="button" data-lang="hi-IN">हिंदी</button></div>
        <label class="chk"><input type="checkbox" id="readBack"> Speak back</label></div>
      <form class="say" id="sayForm"><input id="sayText" placeholder='Type what you would say, e.g. "do kilo cheeni" or "चीनी दो किलो"' aria-label="Type a spoken phrase"><button class="btn sm">Try</button></form>
      <div class="voicebox" id="voiceBox" hidden><div class="heard" id="heard"></div><div class="choices" id="choices"></div></div>
      <div class="depts" id="depts" role="group" aria-label="Departments"></div></div>
    <div class="grid" id="grid"></div><div class="catfoot" id="catInfo"></div>
  </section></div>`;
  $("custName").value=Bill.cust;$("custPhone").value=Bill.phone;$("disc").value=Bill.disc;
  $("autoPrint").checked=LS.get("autoPrint",true);$("readBack").checked=LS.get("readBack",true);
  setPay(Bill.paymode);setLang(LS.get("voiceLang",S().voice_lang));
  renderDepts();renderGrid();renderLines();bindBilling();
}
function setPay(m){Bill.paymode=m;document.querySelectorAll("#paymode button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===m))}
function setLang(l){LS.set("voiceLang",l);document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===l))}
function renderDepts(){const ps=activeProducts();const counts={};ps.forEach(p=>counts[p.dept]=(counts[p.dept]||0)+1);const names=Object.keys(counts).sort();if(Bill.dept!=="All"&&!counts[Bill.dept])Bill.dept="All";
  $("depts").innerHTML=[`<button class="dept" data-d="All" aria-pressed="${Bill.dept==="All"}">All<span>${ps.length}</span></button>`].concat(names.map(d=>`<button class="dept" data-d="${esc(d)}" aria-pressed="${Bill.dept===d}">${esc(d)}<span>${counts[d]}</span></button>`)).join("")}
function renderGrid(){const ps=activeProducts();if(!ps.length){$("grid").innerHTML=`<div class="empty"><b>No products yet</b>Add or upload them on the Products page.</div>`;$("catInfo").textContent="";return}
  const q=$("search").value.trim().toLowerCase();let list=ps.filter(p=>Bill.dept==="All"||p.dept===Bill.dept);
  if(q){const direct=list.filter(p=>p.name.toLowerCase().includes(q)||String(p.aliases||"").toLowerCase().includes(q));list=direct.length?direct:Voice.match(q,list).map(x=>x.p)}
  const inBill=new Set(Bill.lines.map(l=>l.product_id)),groups={};list.forEach(p=>(groups[p.dept]=groups[p.dept]||[]).push(p));const keys=q?Object.keys(groups):Object.keys(groups).sort();
  $("grid").innerHTML=keys.length?keys.map(k=>`<div class="group">${Bill.dept==="All"?`<h3>${esc(k)}</h3>`:""}<div class="tiles">${groups[k].map(p=>`<button class="tile${inBill.has(p.id)?" inbill":""}" data-id="${p.id}"><span class="n">${esc(p.name)}</span><span class="p"><b>₹${fmt(p.rate)}</b>per ${esc(p.unit)}</span></button>`).join("")}</div></div>`).join(""):`<div class="empty"><b>No products found</b>Try another spelling, or use voice.</div>`;
  $("catInfo").textContent=`${list.length} of ${ps.length} products`}
function unitOpts(u){const all=UNITS.includes(u)?UNITS:[u,...UNITS];return all.map(x=>`<option${x===u?" selected":""}>${esc(x)}</option>`).join("")}
function renderLines(flash){
  const L=Bill.lines,E=Bill.editing;
  $("lines").innerHTML=L.map((l,i)=>`<tr data-k="${l.k}"${l.k===flash?' class="flash-row"':""}><td class="sn num">${i+1}</td><td class="item">${esc(l.name)}<small>${esc(l.dept)}</small></td>
    <td class="r"><input class="num" data-f="qty" inputmode="decimal" value="${l.qty}" aria-label="Quantity for ${esc(l.name)}"></td><td><select data-f="unit" aria-label="Unit">${unitOpts(l.unit)}</select></td>
    <td class="r"><div class="ratecell">${l.edited?`<button class="reset" data-reset title="Back to fixed rate ₹${fmt(l.base)}" aria-label="Back to fixed rate">↺</button>`:""}<input class="num${l.edited?" edited":""}" data-f="rate" inputmode="decimal" value="${l.rate}" aria-label="Rate for ${esc(l.name)}" title="${l.edited?"Changed for this bill. Fixed rate ₹"+fmt(l.base):"Fixed rate — change it for this bill only"}"></div></td>
    <td class="r num amt">${fmt(num(l.qty)*num(l.rate))}</td><td><button class="del" data-del aria-label="Remove ${esc(l.name)}">×</button></td></tr>`).join("");
  $("emptyBill").hidden=L.length>0;$("corrBar").hidden=!E;
  if(E)$("corrTitle").innerHTML=`Correcting Bill ${esc(label(E))} <span>· by ${esc(uname(E.created_by))} at ${hm(E.created_at)} · original ${rs(E.net)}</span>`;
  $("billNo").textContent=E?label(E):(()=>{const n=nextNumber(today());return n.series==="daily"?`${shortDate(today())}/${n.no}`:`${n.fy}/${n.no}`})();$("saveBill").innerHTML=E?"Save correction":"Save &amp; print";$("clearBill").hidden=!!E;
  if(flash){const r=document.querySelector(`tr[data-k="${flash}"]`);if(r)r.scrollIntoView({block:"nearest"})}
  totals()}
function calc(){const sub=Bill.lines.reduce((s,l)=>s+r2(num(l.qty)*num(l.rate)),0);const disc=Math.min(Math.max(num($("disc").value),0),sub);const after=r2(sub-disc),net=r0(after);return{sub,disc,round:net-after,net}}
function totals(){const c=calc();$("tCount").textContent=Bill.lines.length;$("tSub").textContent=fmt(c.sub);$("tRound").textContent=(c.round>=0?"+":"")+fmt(c.round);$("tGrand").textContent=rs(c.net);$("tWords").textContent=c.net>0?"Rupees "+words(c.net)+" only":"";$("vBillCount").textContent=Bill.lines.length?`(${Bill.lines.length})`:"";
  Bill.lines.forEach((l,i)=>{const r=$("lines").rows[i];if(r)r.querySelector(".amt").textContent=fmt(num(l.qty)*num(l.rate))})}
function addProduct(id,qty){const p=DB.products.find(x=>x.id===id);if(!p)return null;let l=Bill.lines.find(x=>x.product_id===id&&!x.edited);
  if(l)l.qty=+(num(l.qty)+qty).toFixed(3);else{l={k:uidk(),product_id:p.id,name:p.name,dept:p.dept,unit:p.unit,qty,rate:p.rate,base:p.rate,edited:false};Bill.lines.push(l)}
  Bill.persist();renderLines(l.k);renderGrid();if(innerWidth<=900&&$("billing").dataset.view==="cat")toast(`Added ${p.name}`);return l}
function startCorrection(b){const[ok,why]=canCorrect(b);if(!ok){toast(why,true);return}
  if(Bill.lines.length&&!Bill.editing)Bill.persist();
  Bill.editing=b;Bill.lines=b.items.map(i=>({k:uidk(),product_id:i.product_id,name:i.name,dept:i.dept,unit:i.unit,qty:i.qty,rate:i.rate,base:i.base_rate,edited:Math.abs(i.rate-i.base_rate)>.004}));
  Bill.cust=b.customer;Bill.phone=b.phone;Bill.disc=String(b.discount||0);Bill.paymode=b.paymode;go("billing");toast(`Correcting Bill ${label(b)} — make changes and save`)}
function endCorrection(){Bill.editing=null;Bill.load();renderBilling()}
function bindBilling(){
  const L=()=>Bill.lines;
  $("paymode").onclick=e=>{const b=e.target.closest("button");if(b){setPay(b.dataset.m);Bill.persist()}};
  $("custName").oninput=e=>{Bill.cust=e.target.value;Bill.persist()};$("custPhone").oninput=e=>{Bill.phone=e.target.value;Bill.persist()};
  $("disc").oninput=e=>{Bill.disc=e.target.value;Bill.persist();totals()};
  $("corrCancel").onclick=()=>{endCorrection();toast("Correction cancelled. The bill was not changed.")};
  $("lines").addEventListener("input",e=>{const f=e.target.dataset.f;if(!f)return;const l=L().find(x=>x.k===e.target.closest("tr").dataset.k);l[f]=e.target.value;
    if(f==="rate"){const was=l.edited;l.edited=Math.abs(num(l.rate)-num(l.base))>.004;if(was!==l.edited){Bill.persist();renderLines();const inp=document.querySelector(`tr[data-k="${l.k}"] [data-f=rate]`);inp.focus();inp.setSelectionRange(99,99);return}}
    Bill.persist();totals()});
  $("lines").addEventListener("change",e=>{if(e.target.dataset.f==="unit")Bill.persist()});
  $("lines").addEventListener("click",e=>{const tr=e.target.closest("tr");if(!tr)return;const i=L().findIndex(x=>x.k===tr.dataset.k);
    if(e.target.closest("[data-del]")){L().splice(i,1);Bill.persist();renderLines();renderGrid()}
    if(e.target.closest("[data-reset]")){L()[i].rate=L()[i].base;L()[i].edited=false;Bill.persist();renderLines()}});
  $("grid").onclick=e=>{const t=e.target.closest(".tile");if(t)addProduct(+t.dataset.id,1)};
  $("depts").onclick=e=>{const b=e.target.closest(".dept");if(!b)return;Bill.dept=b.dataset.d;renderDepts();renderGrid()};
  $("search").oninput=renderGrid;$("search").onkeydown=e=>{if(e.key==="Enter"){const t=$("grid").querySelector(".tile");if(t){addProduct(+t.dataset.id,1);e.target.select()}}};
  $("autoPrint").onchange=e=>LS.set("autoPrint",e.target.checked);$("readBack").onchange=e=>LS.set("readBack",e.target.checked);
  document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
  const setView=v=>{$("billing").dataset.view=v;$("vBill").setAttribute("aria-pressed",v==="bill");$("vCat").setAttribute("aria-pressed",v==="cat")};
  $("vBill").onclick=()=>setView("bill");$("vCat").onclick=()=>setView("cat");
  $("saveBill").onclick=()=>{
    const items=L().filter(l=>num(l.qty)>0).map(l=>({product_id:l.product_id,qty:num(l.qty),rate:num(l.rate),unit:l.unit}));
    if(!items.length){toast("Add at least one item",true);return}
    const body={customer:$("custName").value,phone:$("custPhone").value,paymode:Bill.paymode,discount:num($("disc").value),items};
    try{
      if(Bill.editing){const b=correctBill(Bill.editing.id,body);toast(`Bill ${label(b)} corrected · ${rs(b.net)}`);const ap=$("autoPrint").checked;endCorrection();if(ap)printReceipt(receiptHTML(b,false,S().paper),S().paper)}
      else{const b=createBill(body);Bill.reset();renderBilling();toast(`Bill ${label(b)} saved · ${rs(b.net)}`);if(LS.get("autoPrint",true))printReceipt(receiptHTML(b,false,S().paper),S().paper)}
    }catch(err){toast(err instanceof Bad?err.message:"Something went wrong. Try again.",true)}};
  $("copyBill").onclick=async()=>{if(!L().length){toast("Bill is empty",true);return}const c=calc();
    let t=`*${S().shop_name}*\n${Bill.editing?"Bill No: "+label(Bill.editing)+" (revised)\n":""}Date: ${dmy(today())}\n`;if($("custName").value.trim())t+=`Customer: ${$("custName").value.trim()}\n`;
    t+="------------------------------\n";L().forEach((l,i)=>{t+=`${i+1}. ${l.name}\n   ${fq(num(l.qty))} ${l.unit} x ₹${fmt(l.rate)} = ₹${fmt(num(l.qty)*num(l.rate))}\n`});
    t+="------------------------------\n"+`Subtotal: ₹${fmt(c.sub)}\n`+(c.disc?`Discount: -₹${fmt(c.disc)}\n`:"")+`*Net Amount: ${rs(c.net)}* (${Bill.paymode})\n${S().footer}`;
    try{await navigator.clipboard.writeText(t);toast("Copied — paste it in WhatsApp")}catch(e){toast("This browser blocked copying",true)}};
  $("clearBill").onclick=e=>{const btn=e.currentTarget;if(!L().length)return;if(!btn.classList.contains("armed")){btn.classList.add("armed");btn.textContent="Tap again to clear";setTimeout(()=>{btn.classList.remove("armed");btn.textContent="Clear"},2500);return}
    Bill.reset();renderBilling()};
  /* voice */
  const unitSpeech={Nos:"",Kgs:"kilo",Gms:"gram",Dozen:"dozen",Set:"set",Ltr:"litre",Mtr:"metre",Pkt:"packet",Box:"box",Pair:"pair"};
  const voiceAdd=(p,qty,heard)=>{const l=addProduct(p.id,qty);if(!l)return;$("voiceBox").hidden=false;
    $("heard").innerHTML=`Heard <b>“${esc(heard)}”</b> → added <b>${fq(qty)} ${esc(p.unit)}</b> ${esc(p.name)} <span class="num">(now ${fq(num(l.qty))})</span>`;$("choices").innerHTML="";
    if($("readBack").checked)Voice.speak(`${p.name}, ${fq(qty)} ${unitSpeech[p.unit]??p.unit}`,LS.get("voiceLang","en-IN"))};
  const onVoice=alts=>{const ps=activeProducts();const r=Voice.resolve(alts,ps);$("voiceBox").hidden=false;
    if(r.sure){voiceAdd(r.matches[0].p,Voice.qtyFor(r.parsed,r.matches[0].p),r.text);return}
    if(r.matches.length){$("heard").innerHTML=`Heard <b>“${esc(r.text)}”</b>${r.parsed.qty!=null?` · qty <b>${fq(r.parsed.qty)}${r.parsed.unitHint?" "+r.parsed.unitHint:""}</b>`:""} — which one?`;
      $("choices").innerHTML=r.matches.map(m=>`<button data-id="${m.p.id}">${esc(m.p.name)} <span class="num">₹${fmt(m.p.rate)}</span></button>`).join("")+`<button data-none>None of these</button>`;
      $("choices").onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.hasAttribute("data-none")){$("voiceBox").hidden=true;return}const p=DB.products.find(x=>x.id===+b.dataset.id);voiceAdd(p,Voice.qtyFor(r.parsed,p),r.text)};return}
    $("heard").innerHTML=`Heard <b>“${esc(r.text)}”</b> — no product matches. Try again, or add this word as an alias on the Products page.`;$("choices").innerHTML=""};

  document.onkeydown=e=>{if(view!=="billing"||!$("overlay").hidden)return;if(e.key==="F2"){e.preventDefault();listen()}if(e.key==="F9"){e.preventDefault();$("saveBill").click()}};

/* ============================================================ bills */
let billsDate=today(),billSel=null;
function logEntryHTML(c){const d=c.after_net-c.before_net;
  return `<div class="logentry"><div class="loghead"><b>Bill ${esc(c.label)} <span class="pill ${c.kind==="cancel"?"red":""}">${c.kind==="cancel"?"Cancelled":"Revision "+c.rev}</span></b><small>${dmy(c.at)} ${hm(c.at)} · by ${esc(c.by)}</small></div>
  <div class="logbody"><ul class="chg">${c.changes.map(x=>`<li class="${x.t}">${esc(x.s)}</li>`).join("")}</ul>
  <div class="netchg">Net ${rs(c.before_net)} → ${rs(c.after_net)} <span class="${d<0?"down":"up"}">(${d<0?"−":"+"}${rs(Math.abs(d))})</span></div></div></div>`}
let billsMode="date",billsModeSet=false;
function renderBills(){
  const A=isOwner(),mode=A?billsMode:"date",d=billsDate;
  const pending=A?DB.bills.filter(b=>!isVerified(b)).length:0;
  $("view").innerHTML=`<div class="head"><h1 class="title">Bills</h1><div class="row">
    ${A?`<div class="seg" role="group" aria-label="Show"><button data-mode="verify" aria-pressed="${mode==="verify"}">To verify${pending?` (${pending})`:""}</button><button data-mode="date" aria-pressed="${mode==="date"}">By date</button></div>`:""}
    ${mode==="date"?`<div class="field"><label for="bDate">Date</label><input type="date" id="bDate" value="${d}" max="${today()}"></div>`:""}
    <div class="field"><label for="bQ">Find</label><input id="bQ" type="search" placeholder="Bill no. or customer"></div></div></div>
  <div class="split"><div class="card" style="padding:0"><div class="tw"><table><thead><tr><th>Bill</th><th>${mode==="verify"?"Date":"Time"}</th><th>Customer</th><th>Paid</th><th class="r">Net ₹</th><th>By</th>${A?"<th>Check</th>":""}</tr></thead><tbody id="bList"></tbody></table></div>
    <div class="empty" id="bEmpty" hidden></div><div class="note" id="bSum" style="padding:10px 14px"></div></div>
    <div class="card" id="bDetail"><p class="note">${mode==="verify"?"Tap a bill to check it. After checking, press Verify & next.":"Select a bill to see it, reprint it or correct it."}</p></div></div>`;
  const all=()=>mode==="verify"?DB.bills.filter(b=>!isVerified(b)).sort((a,b)=>a.id-b.id):DB.bills.filter(b=>b.bill_date===d).sort((a,b)=>b.id-a.id);
  const draw=()=>{const q=$("bQ").value.trim().toLowerCase().replace(/^#/,"");const L=all();
    const list=L.filter(b=>!q||String(b.no)===q||label(b)===q||(b.customer||"cash").toLowerCase().includes(q));
    $("bList").innerHTML=list.map(b=>`<tr class="click${b.status!=="active"?" cx":""}${billSel===b.id?" sel":""}" data-id="${b.id}"><td class="num"><b>${label(b)}</b> ${b.rev&&b.status==="active"?'<span class="pill">Corrected</span>':""}${b.status!=="active"?'<span class="pill red">Cancelled</span>':""}</td>
      <td class="num">${mode==="verify"?dmy(b.bill_date)+" "+hm(b.created_at):hm(b.created_at)}</td><td>${esc(b.customer||"Cash")}</td><td>${b.paymode}</td><td class="r num">${fmt(b.net)}</td><td>${esc(uname(b.created_by))}</td>${A?`<td>${verifyPill(b)}</td>`:""}</tr>`).join("");
    $("bEmpty").hidden=list.length>0;
    $("bEmpty").innerHTML=mode==="verify"?"<b>All bills verified</b>New bills and any bill changed after you verified it will appear here.":"<b>No bills</b>Bills saved on this date will show here.";
    const act=L.filter(b=>b.status==="active");$("bSum").textContent=L.length?`${L.length} bill${L.length>1?"s":""} · ${rs(act.reduce((s,b)=>s+b.net,0))}${L.length-act.length?` · ${L.length-act.length} cancelled`:""}`:""};
  const show=id=>{billSel=id;draw();const b=DB.bills.find(x=>x.id===id);const[ok,why]=canCorrect(b);const active=b.status==="active";const hist=DB.corrections.filter(c=>c.bill_id===b.id).map(corrView).reverse();
    const v=b.verified;const vtxt=isVerified(b)?`Verified by ${esc(uname(v.by))} on ${dmy(v.at)} ${hm(v.at)}`:changedAfterVerify(b)?`You verified this on ${dmy(v.at)} ${hm(v.at)}, but it was changed afterwards. Check the change history below.`:"Not verified yet";
    $("bDetail").innerHTML=`<div class="row" style="justify-content:space-between;align-items:center"><h2>Bill ${label(b)}</h2>${!active?'<span class="pill red">Cancelled</span>':b.rev?`<span class="pill">Corrected ${b.rev}×</span>`:""}</div>
      ${A?`<div class="row" style="align-items:center;justify-content:space-between"><span class="note">${verifyPill(b)} ${vtxt}</span>${isVerified(b)?`<button class="btn sm" id="unverify">Undo verify</button>`:`<button class="btn primary" id="verify">${mode==="verify"?"Verify &amp; next":"Mark verified"}</button>`}</div>`:""}
      <div class="rprev">${receiptHTML(b,false)}</div>
      <div class="row"><button class="btn" id="reprint">Reprint</button>${ok?`<button class="btn" id="correct">Correct this bill</button>`:`<span class="note">${esc(why)}</span>`}${active?`<button class="btn danger" id="cxGo">Cancel bill</button>`:""}</div>
      ${A&&hist.length?`<h3>Change history</h3><div class="stack">${hist.map(logEntryHTML).join("")}</div>`:""}`;
    $("reprint").onclick=()=>showReceipt(b,true,`Bill ${label(b)} — reprint`);if($("correct"))$("correct").onclick=()=>startCorrection(b);
    if($("verify"))$("verify").onclick=()=>{verifyBills([b]);const rest=all();toast(`Bill ${label(b)} verified`);
      if(mode==="verify"){if(rest.length){show(rest[0].id)}else{billSel=null;renderBills();toast("All bills verified")}}else show(b.id);updateBadge()};
    if($("unverify"))$("unverify").onclick=()=>{b.verified=null;save();show(b.id);updateBadge()};
    if($("cxGo"))$("cxGo").onclick=e=>{const btn=e.currentTarget;if(!btn.classList.contains("armed")){btn.classList.add("armed");btn.textContent=`Tap again to cancel ${label(b)}`;setTimeout(()=>{if(btn.isConnected){btn.classList.remove("armed");btn.textContent="Cancel bill"}},3000);return}
      try{cancelBill(b.id);toast(`Bill ${label(b)} cancelled`);show(b.id);updateBadge()}catch(err){toast(err.message,true)}};
    if(innerWidth<=900)$("bDetail").scrollIntoView({behavior:"smooth"})};
  $("bList").onclick=e=>{const tr=e.target.closest("tr");if(tr)show(+tr.dataset.id)};$("bQ").oninput=draw;
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{billsMode=b.dataset.mode;billsModeSet=true;billSel=null;renderBills()});
  if($("bDate"))$("bDate").onchange=e=>{billsDate=e.target.value||today();billSel=null;renderBills()};
  draw();

function updateBadge(){const btn=document.querySelector('[data-go="bills"]');if(!btn||!isOwner())return;const n=DB.bills.filter(b=>!isVerified(b)).length;const old=btn.querySelector(".badge");if(old)old.remove();if(n)btn.insertAdjacentHTML("beforeend",`<span class="badge" title="Bills to verify">${n}</span>`);
  const seg=document.querySelector('[data-mode="verify"]');if(seg)seg.textContent=`To verify${n?` (${n})`:""}`}

  const rows=DB.corrections.filter(c=>c.at.slice(0,10)>=logFrom&&c.at.slice(0,10)<=logTo&&(!logWho||String(c.user_id)===logWho)).map(corrView).reverse();

/* ============================================================ products */
function cleanProduct(d){const name=String(d.name||"").trim();if(!name)throw new Bad("Enter the item name.");const rate=num(d.rate);if(rate<0)throw new Bad("Rate can't be negative.");
  return{name:name.slice(0,120),dept:(String(d.dept||"").trim()||"General").slice(0,60),unit:normUnit(d.unit),rate:r2(rate),aliases:String(d.aliases||"").split(",").map(a=>a.trim()).filter(Boolean).join(", ").slice(0,300)}}
function parseCSV(t){const rows=[];let row=[],cur="",q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){cur+='"';i++}else q=false}else cur+=c}else if(c=='"')q=true;else if(c==","||c=="\t"){row.push(cur);cur=""}else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;row.push(cur);rows.push(row);row=[];cur=""}else cur+=c}
  if(cur||row.length){row.push(cur);rows.push(row)}return rows.filter(r=>r.some(x=>String(x).trim()))}
/* Minimal .xlsx reader: first sheet → rows of cell text. Uses the browser's built-in unzip. */
async function readXlsx(buf){
  if(typeof DecompressionStream==="undefined")throw new Bad("This device can't open Excel files. Save the sheet as CSV and upload that.");
  const u8=new Uint8Array(buf),dv=new DataView(buf),td=new TextDecoder();let e=u8.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw new Bad("That isn't an .xlsx file. In Excel use Save As → .xlsx or CSV.");
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const files={};
  for(let i=0;i<n;i++){const nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true);files[td.decode(u8.subarray(p+46,p+46+nl))]={m:dv.getUint16(p+10,true),cs:dv.getUint32(p+20,true),lho:dv.getUint32(p+42,true)};p+=46+nl+el+cl}
  const get=async name=>{const f=files[name];if(!f)return null;const st=f.lho+30+dv.getUint16(f.lho+26,true)+dv.getUint16(f.lho+28,true);const data=u8.slice(st,st+f.cs);
    if(f.m===0)return td.decode(data);const out=await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer();return td.decode(out)};
  const xml=t=>new DOMParser().parseFromString(t,"application/xml");
  const ss=[];const sst=await get("xl/sharedStrings.xml");if(sst)[...xml(sst).getElementsByTagName("si")].forEach(si=>ss.push([...si.getElementsByTagName("t")].map(t=>t.textContent).join("")));
  let sheet="xl/worksheets/sheet1.xml";
  try{const wb=xml(await get("xl/workbook.xml")),first=wb.getElementsByTagName("sheet")[0],rid=first&&(first.getAttribute("r:id")||first.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id"));
    const rels=xml(await get("xl/_rels/workbook.xml.rels"));const rel=[...rels.getElementsByTagName("Relationship")].find(r=>r.getAttribute("Id")===rid);
    if(rel){let t=rel.getAttribute("Target");sheet=t.startsWith("/")?t.slice(1):"xl/"+t}}catch(err){}
  const sx=await get(sheet);if(!sx)throw new Bad("Couldn't find a sheet in that Excel file.");
  const col=r=>{let c=0;for(const ch of r.replace(/\d+/g,""))c=c*26+ch.charCodeAt(0)-64;return c-1};
  return [...xml(sx).getElementsByTagName("row")].map(row=>{const out=[];[...row.getElementsByTagName("c")].forEach(c=>{const t=c.getAttribute("t"),v=c.getElementsByTagName("v")[0];let val="";
      if(t==="s")val=v?ss[+v.textContent]??"":"";else if(t==="inlineStr")val=[...c.getElementsByTagName("t")].map(x=>x.textContent).join("");else val=v?v.textContent:"";
      out[col(c.getAttribute("r")||"A")]=val});for(let i=0;i<out.length;i++)if(out[i]===undefined)out[i]="";return out}).filter(r=>r.some(x=>String(x).trim()))}
function importRows(rows,replace){if(!rows.length)throw new Bad("The file is empty.");const h=rows[0].map(x=>String(x).trim().toLowerCase());const find=re=>h.findIndex(x=>re.test(x));
  let ni=find(/item|name|product|particular|description/),di=find(/dep|categ|section|group/),ui=find(/unit|uom|measure/),ri=find(/rate|price|mrp|amount/),ai=find(/alias|other name|hindi|local/);let body=rows.slice(1);
  if(ni<0&&ri<0){const w=rows[0].length;if(w<2||!/^\s*[\d.,₹]+\s*$/.test(String(rows[0][w-1])))throw new Bad("Couldn't find the Item Name and Rate columns. The first row should be: Item Name, Department, Unit, Rate.");ni=0;ri=w-1;di=w>3?1:-1;ui=w>3?2:w>2?1:-1;body=rows}if(ni<0)throw new Bad("Couldn't find an Item Name column. Check the header row.");
  const cell=(r,i)=>i>=0&&i<r.length&&r[i]!=null?String(r[i]).trim():"";const items=body.map(r=>({name:cell(r,ni).slice(0,120),dept:(cell(r,di)||"General").slice(0,60),unit:normUnit(cell(r,ui)),rate:r2(Math.max(num(cell(r,ri)),0)),aliases:cell(r,ai).slice(0,300)})).filter(x=>x.name);
  if(!items.length)throw new Bad("No product rows found under the header.");
  if(replace)DB.products.forEach(p=>p.active=false);let added=0,updated=0;
  items.forEach(n=>{const ex=DB.products.filter(p=>p.name.toLowerCase()===n.name.toLowerCase()).sort((a,b)=>b.active-a.active)[0];
    if(ex){Object.assign(ex,{dept:n.dept,unit:n.unit,rate:n.rate,active:true});if(n.aliases)ex.aliases=n.aliases;updated++}else{DB.products.push({id:nextId(),...n,active:true});added++}});save();return `Upload done: ${added} new, ${updated} updated.`}

/* Roles: internal "admin" = Owner (you), internal "staff" = Admin (the person running the shop). */

      ${us.map(u=>`<tr data-id="${u.id}"><td><b>${esc(u.name)}</b>${u.id===me.id?' <span class="note">(you)</span>':""}</td><td class="num">${esc(u.username)}</td><td><span class="role ${u.role==="admin"?"admin":""}">${roleName(u.role)}</span></td>

  $("uForm").onsubmit=e=>{e.preventDefault();const name=$("uName").value.trim(),username=$("uUser").value.trim(),pw=$("uPw").value;let err=validUser(name,username,pw);
    if(!err&&DB.users.some(u=>u.username.toLowerCase()===username.toLowerCase()))err=`Login ID ${username} is already taken.`;if(err){toast(err,true);return}

        <div class="field"><label for="sVoice">Default voice language</label><select id="sVoice"><option value="en-IN" ${s.voice_lang==="en-IN"?"selected":""}>English (India)</option><option value="hi-IN" ${s.voice_lang==="hi-IN"?"selected":""}>Hindi</option></select></div></div>
      ${O?`<div class="field"><label for="sCorr">Which saved bills can the admin correct</label><select id="sCorr"><option value="any" ${s.staff_correct==="any"?"selected":""}>Any bill</option><option value="today" ${s.staff_correct==="today"?"selected":""}>Only today's bills</option><option value="none" ${s.staff_correct==="none"?"selected":""}>None — only the owner corrects</option></select></div>
      <p class="note">Every correction is recorded in your correction log with what changed, who did it and when. The admin can't see the log.</p>
      <div class="field"><label for="sNum">Bill numbers</label><select id="sNum"><option value="daily" ${(s.numbering||"daily")==="daily"?"selected":""}>Start from 1 every day (e.g. ${shortDate(today())}/1)</option><option value="fy" ${s.numbering==="fy"?"selected":""}>Continue through the financial year (e.g. ${fyOf(today())}/1)</option></select></div>
      <p class="note">Changing this affects new bills only. Old bills keep their numbers.</p>`:""}
      <div><button class="btn primary">Save settings</button></div></form>
    <div class="stack"><div class="card"><h2>Backup</h2><p class="note">Save everything (bills, products, users) as one file. Keep the backup file safe — copy it to a pen drive, Google Drive or WhatsApp it to yourself.</p>
      <p class="note"><b>Last backup:</b> ${DB.lastBackup?dmy(DB.lastBackup)+" "+hm(DB.lastBackup):"never"}. Take one at least every few days. The file goes to the Downloads folder.</p>
      <div class="row"><button class="btn" id="bkSave">Download backup</button>${O?`<label class="btn" for="bkFile" style="cursor:pointer">Restore from file</label><input type="file" id="bkFile" accept=".json" hidden>`:""}</div>
      ${O?"":`<p class="note">Only the owner can restore a backup or clear data.</p>`}</div>
      ${O?`<div class="card" id="resetCard"><h2>Start fresh</h2><p class="note">${DB.demo?"This page is showing sample data. Clear it to start with your own shop: you'll create the owner login, then add products.":"Delete all bills, products and users on this device and start setup again. Take a backup first."}</p>
        <div><button class="btn danger" id="resetAll">Clear everything</button></div></div>`:""}</div></div>`;
  $("sForm").onsubmit=e=>{e.preventDefault();Object.assign(DB.settings,{shop_name:$("sShop").value.trim()||"My Retail Store",header:$("sHeader").value.trim().slice(0,400),footer:$("sFooter").value.trim().slice(0,120),paper:$("sPaper").value,voice_lang:$("sVoice").value},O&&$("sCorr")?{staff_correct:$("sCorr").value,numbering:$("sNum").value}:{});save();render();toast("Settings saved.")};
  $("bkSave").onclick=()=>{if(saveFile(`counter-bill-backup-${today()}.json`,JSON.stringify(DB))){DB.lastBackup=stamp();save();renderSettings()}};
  if($("bkFile"))$("bkFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d.users||!d.bills||!d.products)throw 0;DB=d;flush();me=null;LS.del("session");Bill.reset();view="billing";render();toast("Backup restored. Log in with the IDs from the backup.")}catch(err){toast("That isn't a Counter Bill backup file.",true)}e.target.value=""};
  if($("resetAll"))$("resetAll").onclick=e=>{const b=e.currentTarget;if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="Tap again to delete everything";setTimeout(()=>{b.classList.remove("armed");b.textContent="Clear everything"},3000);return}
    DB=blankDB();save();me=null;LS.del("session");Bill.reset();view="billing";render()};
}

/* ============================================================ install as app, auto-lock, start-up */
let installEvt=null;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;document.querySelectorAll(".install-app").forEach(b=>b.hidden=false)});
addEventListener("appinstalled",()=>{installEvt=null;document.querySelectorAll(".install-app").forEach(b=>b.hidden=true);toast("Installed — open Counter Bill from the home screen")});
document.addEventListener("click",async e=>{if(!e.target.closest(".install-app")||!installEvt)return;installEvt.prompt();await installEvt.userChoice;installEvt=null;document.querySelectorAll(".install-app").forEach(b=>b.hidden=true)});
/* Owner login locks itself after 10 minutes without use, so the admin can't continue as owner */
let lastAct=Date.now();["pointerdown","keydown","touchstart"].forEach(ev=>addEventListener(ev,()=>lastAct=Date.now(),{passive:true}));
setInterval(()=>{if(me&&isOwner()&&Date.now()-lastAct>10*60*1000){me=null;LS.del("session");closeModal();render();toast("Owner login locked after 10 minutes. Log in again.")}},20000);
/* Only one copy of the app may be in use at a time, so two windows can't overwrite each other's bills */
const BC=("BroadcastChannel" in self)?new BroadcastChannel("counter-bill"):null;let otherOpen=false;
if(BC)BC.onmessage=e=>{
  if(e.data==="hello"&&!blocked)BC.postMessage("here");
  if(e.data==="here")otherOpen=true;
  if(e.data==="takeover"&&!blocked){if(saveTimer)flush();showBlocked()}};
function showBlocked(){blocked=true;closeModal();
  $("app").innerHTML=`<div class="wrap"><div class="authwrap"><div class="card authcard"><h1 class="title">Counter Bill is open in another window</h1>
    <p class="note">To keep bills safe, only one window can be used at a time. Close this one, or tap below to use it here instead (the other window will stop).</p>
    <button class="btn primary" id="useHere" style="padding:11px">Use it here</button></div></div></div>`;
  $("useHere").onclick=takeOver}
async function loadDB(){DB=null;try{if(!IDB.db)await IDB.open();idbOK=true;const raw=await IDB.get("db");if(raw)DB=JSON.parse(raw)}catch(e){idbOK=false}}
async function takeOver(){if(BC)BC.postMessage("takeover");await new Promise(r=>setTimeout(r,400));await loadDB();if(!DB)DB=blankDB();blocked=false;
  const sid=LS.get("session",null),u=sid&&userById(sid);me=u&&u.active&&u.role!=="admin"?u:null;Bill.load();view="billing";render()}
async function boot(){
  if(BC){BC.postMessage("hello");await new Promise(r=>setTimeout(r,350));if(otherOpen){showBlocked();return}}
  await loadDB();
  if(!DB){const old=LS.get("db",null);if(old&&old.users)DB=old}
  if(!DB)DB=blankDB();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  const sid=LS.get("session",null),u=sid&&userById(sid);
  if(u&&u.active&&u.role!=="admin")me=u;   /* the owner always logs in again after the app is closed */
  Bill.load();render();
  if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
}
boot();
</script>
